            format: uuid
      responses:
        "200":
          description: Audit event details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /audit/export:
    post:
      operationId: exportAuditLog
      summary: Export audit log
      description: Export filtered audit events as CSV or JSON for compliance reporting.
      tags: [Audit]
      x-nist-controls: [AU-9]
      x-owasp: [A01, A09, API1, API4, API5]
      x-audit-event: audit.exported
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                format:
                  type: string
                  enum: [csv, json]
                  default: json
                from:
                  type: string
                  format: date-time
                  maxLength: 35
                to:
                  type: string
                  format: date-time
                  maxLength: 35
                eventTypes:
                  type: array
                  items:
                    type: string
                    maxLength: 100
                  maxItems: 50
              additionalProperties: false
      responses:
        "200":
          description: Exported audit data
          content:
            application/json:
              schema:
                type: string
                format: binary
            text/csv:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

