  # ════════════════════════════════════════════════════════════════
  # EVENTBUS (WebSocket Real-Time)
  # ════════════════════════════════════════════════════════════════

  /events/stream:
    get:
      operationId: eventBusStream
      summary: WebSocket EventBus for real-time dashboard updates
      description: |
        Upgrades to WebSocket for real-time event streaming.
        All dashboard state updates via this stream — no polling, no manual refresh.

        When an agent connects, a shell session starts, a file upload completes,
        or any state changes — every connected browser sees it immediately.

        **Inbound messages:**
        - `{"type": "subscribe", "channels": ["agents", "shell", "audit"]}` — subscribe
        - `{"type": "unsubscribe", "channels": ["audit"]}` — unsubscribe
        - `{"type": "ping"}` — keepalive

        **Outbound messages:**
        - `{"type": "event", "channel": "agents", "event": "agent.connected", "data": {...}}` — event
        - `{"type": "pong"}` — keepalive response
        - `{"type": "error", "message": "..."}` — error

        **Channels:**
        - `agents` — agent connections, disconnections, status changes
        - `shell` — shell session lifecycle
        - `files` — file operation completions
        - `auth` — login/logout events
        - `audit` — all audit events (requires audit:read permission)
        - `metrics` — agent metric updates
        - `exec` — bulk exec progress
        - `system` — server-level events
      tags: [EventBus]
      x-nist-controls: [SI-4]
      x-owasp: [A01, A07, API1, API2, API4]
      parameters:
        - name: channels
          in: query
          description: Comma-separated list of channels to subscribe on connect
          schema:
            type: string
            maxLength: 500
          example: "agents,shell,files"
      responses:
        "101":
          description: WebSocket connection established
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ════════════════════════════════════════════════════════════════
  # SERVER CONFIGURATION
  # ════════════════════════════════════════════════════════════════

  /config:
    get:
      operationId: getServerConfig
      summary: Get server configuration
      description: |
        Returns the current server configuration (server.yaml values).
        Security-sensitive fields are redacted.

        **NIST CM-2, CM-6:** Baseline configuration and settings.
      tags: [Server Config]
      x-nist-controls: [CM-2, CM-6]
      x-owasp: [A01, API1, API3, API5]
      responses:
        "200":
          description: Server configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerConfig"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      operationId: updateServerConfig
      summary: Update server configuration
      description: |
        Updates server configuration. Some changes require restart.
        All config changes are audit-logged.

        **NIST CM-3:** Configuration change control.
        **x-audit-event:** config.updated
      tags: [Server Config]
      x-nist-controls: [CM-3]
      x-owasp: [A01, A05, API3, API5, API8]
      x-audit-event: config.updated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServerConfigUpdate"
      responses:
        "200":
          description: Configuration updated
          content:
            application/json:
              schema:
                type: object
                required: [config, restartRequired]
                properties:
                  config:
                    $ref: "#/components/schemas/ServerConfig"
                  restartRequired:
                    type: boolean
                  changedFields:
                    type: array
                    items:
                      type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ════════════════════════════════════════════════════════════════
  # SERVICES
  # ════════════════════════════════════════════════════════════════

  /services:
    get:
      operationId: listServices
      summary: List enabled services
      description: |
        Returns services enabled for the authenticated tenant.
        CE ships with one service (`remote-access`), seeded at setup time.
        The SaaS platform adds additional services per tenant plan.

        Middleware uses this registry to enforce `jwt.services` claims:
        each endpoint's tag has an `x-service` extension, and the middleware
        verifies the JWT includes the required service slug before routing.
      tags: [Services]
      x-nist-controls: [AC-3]
      x-owasp: [A01, API1, API3]
      responses:
        "200":
          description: List of enabled services
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Service"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /services/{serviceSlug}:
    get:
      operationId: getService
      summary: Get service details
      description: |
        Returns details for a specific enabled service by slug.
        Returns 404 if the service is not enabled for this tenant.
      tags: [Services]
      x-nist-controls: [AC-3]
      x-owasp: [A01, API1, API3]
      parameters:
        - name: serviceSlug
          in: path
          required: true
          schema:
            type: string
            maxLength: 100
            pattern: "^[a-z0-9][a-z0-9-]*$"
          description: "Service slug (e.g. `remote-access`)"
          example: "remote-access"
      responses:
        "200":
          description: Service details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ════════════════════════════════════════════════════════════════
  # ACME / TLS
  # ════════════════════════════════════════════════════════════════

  /acme/status:
    get:
      operationId: getAcmeStatus
      summary: Get ACME certificate status
      description: Returns TLS certificate status from Let's Encrypt ACME provisioning.
      tags: [ACME]
      x-nist-controls: [SC-8]
      x-owasp: [A01, A02, API1, API5]
      responses:
        "200":
          description: ACME certificate status
          content:
            application/json:
              schema:
                type: object
                required: [domain, issuer, notBefore, notAfter, autoRenew]
                properties:
                  domain:
                    type: string
                  issuer:
                    type: string
                    example: "Let's Encrypt"
                  notBefore:
                    type: string
                    format: date-time
                  notAfter:
                    type: string
                    format: date-time
                  autoRenew:
                    type: boolean
                  algorithm:
                    type: string
                    example: "ECDSA P-256"
                    description: |
                      Let's Encrypt doesn't issue PQC certs yet.
                      ECDSA P-256 is used (ACME constraint).
                  algorithmWarning:
                    type:
                      - string
                      - "null"
                    example: "Classical algorithm — Let's Encrypt does not yet support PQC certificates."
                  daysUntilExpiry:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /acme/renew:
    post:
      operationId: renewAcmeCertificate
      summary: Force ACME certificate renewal
      tags: [ACME]
      x-nist-controls: [SC-8, AU-12]
      x-owasp: [A01, A02, API5, API6]
      x-audit-event: acme.renewed
      responses:
        "202":
          description: Renewal initiated
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ════════════════════════════════════════════════════════════════
  # AGENT CONNECTION (WebSocket/QUIC handshake)
  # ════════════════════════════════════════════════════════════════

  /agent/v1/connect:
    get:
      operationId: agentConnect
      summary: Agent WebSocket connection endpoint (fallback)
      description: |
        WebSocket upgrade endpoint for agent connections when QUIC (UDP) is blocked.
        Agent presents token via `Authorization: Bearer <token>` header during upgrade.

        For QUIC, agents connect to `quic://[domain]:443` and present identity
        (hostname, OS, arch, agent-id) in the CWP HELLO frame, then authenticate
        via a separate AUTH frame containing an HMAC-SHA256 signature of the
        HELLO payload using the agent key.

        **CWP Frame Types:** HELLO (0x01), AUTH (0x02), SHELL_DATA (0x10),
        SHELL_RESIZE (0x11), SHELL_START (0x12), SHELL_EXIT (0x13),
        FILE_LIST (0x20), FILE_READ (0x21), FILE_WRITE (0x22), FILE_STAT (0x23),
        AGENT_INFO (0x30), EXEC_START (0x40), EXEC_DATA (0x41), EXEC_EXIT (0x42),
        PING (0xF0), PONG (0xF1). See CLAUDE.md for full wire protocol specification.

        **Transport precedence:**
        1. QUIC (UDP 443) — preferred, ~5s timeout
        2. WebSocket (TCP 443) — automatic fallback

        This endpoint is NOT a REST API — it upgrades to WebSocket for the
        binary CWP protocol.
      tags: [Agents]
      security:
        - AgentToken: []
      x-nist-controls: [IA-2, AU-12]
      x-owasp: [A02, A07, API2, API4]
      x-audit-event: agent.connected
      parameters:
        - name: Connection
          in: header
          required: true
          schema:
            type: string
            const: Upgrade
        - name: Upgrade
          in: header
          required: true
          schema:
            type: string
            const: websocket
      responses:
        "101":
          description: WebSocket upgrade — CWP protocol begins
        "401":
          description: Invalid agent token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: Agent not registered or revoked
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

# ══════════════════════════════════════════════════════════════════
# WEBHOOKS (Server → External)
# ══════════════════════════════════════════════════════════════════

webhooks:
  agent.connected:
    post:
      operationId: onAgentConnected
      summary: Agent connected event
      description: |
        Fired when an agent establishes a connection to the master.
        Signed with HMAC-SHA256. At-least-once delivery.
      tags: [Webhooks]
      x-nist-controls: [AU-2, AU-3, AU-12]
      x-owasp: [A09, API1]
      parameters:
        - $ref: "#/components/parameters/WebhookEventId"
        - $ref: "#/components/parameters/WebhookTimestamp"
        - $ref: "#/components/parameters/WebhookSignature"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/WebhookEvent"
                - type: object
                  properties:
                    eventType:
                      const: agent.connected
                    data:
                      type: object
                      required: [agentId, hostname, transport]
                      properties:
                        agentId:
                          type: string
                          format: uuid
                        hostname:
                          type: string
                        transport:
                          type: string
                          enum: [quic, websocket]
                        ip:
                          type: string
      responses:
        "200":
          description: Acknowledged

  agent.disconnected:
    post:
      operationId: onAgentDisconnected
      summary: Agent disconnected event
      tags: [Webhooks]
      x-nist-controls: [AU-2, AU-3, AU-12]
      x-owasp: [A09, API1]
      parameters:
        - $ref: "#/components/parameters/WebhookEventId"
        - $ref: "#/components/parameters/WebhookTimestamp"
        - $ref: "#/components/parameters/WebhookSignature"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/WebhookEvent"
                - type: object
                  properties:
                    eventType:
                      const: agent.disconnected
                    data:
                      type: object
                      required: [agentId, reason]
                      properties:
                        agentId:
                          type: string
                          format: uuid
                        reason:
                          type: string
      responses:
        "200":
          description: Acknowledged

  auth.login:
    post:
      operationId: onAuthLogin
      summary: User login event
      tags: [Webhooks]
      x-nist-controls: [AU-2, AU-3, AU-12, AC-7]
      x-owasp: [A07, A09, API1]
      parameters:
        - $ref: "#/components/parameters/WebhookEventId"
        - $ref: "#/components/parameters/WebhookTimestamp"
        - $ref: "#/components/parameters/WebhookSignature"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/WebhookEvent"
                - type: object
                  properties:
                    eventType:
                      const: auth.login
                    data:
                      type: object
                      required: [userId, method, sourceIp]
                      properties:
                        userId:
                          type: string
                          format: uuid
                        email:
                          type: string
                          format: email
                        method:
                          type: string
                          enum: [webauthn, password, sso, cli_device]
                        sourceIp:
                          type: string
      responses:
        "200":
          description: Acknowledged

  shell.session.started:
    post:
      operationId: onShellSessionStarted
      summary: Shell session started
      tags: [Webhooks]
      x-nist-controls: [AU-2, AU-3, AU-12]
      x-owasp: [A09, API1]
      parameters:
        - $ref: "#/components/parameters/WebhookEventId"
        - $ref: "#/components/parameters/WebhookTimestamp"
        - $ref: "#/components/parameters/WebhookSignature"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/WebhookEvent"
                - type: object
                  properties:
                    eventType:
                      const: shell.session.started
                    data:
                      type: object
                      required: [sessionId, userId, agentId]
                      properties:
                        sessionId:
                          type: string
                          format: uuid
                        userId:
                          type: string
                          format: uuid
                        agentId:
                          type: string
                          format: uuid
      responses:
        "200":
          description: Acknowledged

  user.created:
    post:
      operationId: onUserCreated
      summary: User created event
      tags: [Webhooks]
      x-nist-controls: [AU-2, AU-3, AU-12, AC-2]
      x-owasp: [A09, API1]
      parameters:
        - $ref: "#/components/parameters/WebhookEventId"
        - $ref: "#/components/parameters/WebhookTimestamp"
        - $ref: "#/components/parameters/WebhookSignature"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/WebhookEvent"
                - type: object
                  properties:
                    eventType:
                      const: user.created
                    data:
                      type: object
                      required: [userId, email, role]
                      properties:
                        userId:
                          type: string
                          format: uuid
                        email:
                          type: string
                          format: email
                        role:
                          type: string
      responses:
        "200":
          description: Acknowledged

  user.deleted:
    post:
      operationId: onUserDeleted
      summary: User deleted event (minimal data per NIST SI-12)
      tags: [Webhooks]
      x-nist-controls: [AU-2, AU-3, AU-12, AC-2, SI-12]
      x-owasp: [A09, API1]
      parameters:
        - $ref: "#/components/parameters/WebhookEventId"
        - $ref: "#/components/parameters/WebhookTimestamp"
        - $ref: "#/components/parameters/WebhookSignature"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/WebhookEvent"
                - type: object
                  properties:
                    eventType:
                      const: user.deleted
                    data:
                      type: object
                      required: [userId]
                      properties:
                        userId:
                          type: string
                          format: uuid
      responses:
        "200":
          description: Acknowledged


  audit.event:
    post:
      operationId: onAuditEvent
      summary: Generic audit event webhook
      description: Fired for all audit events if subscribed to `audit.*`.
      tags: [Webhooks]
      x-nist-controls: [AU-2, AU-3, AU-6, AU-9, AU-12]
      x-owasp: [A09, API1]
      parameters:
        - $ref: "#/components/parameters/WebhookEventId"
        - $ref: "#/components/parameters/WebhookTimestamp"
        - $ref: "#/components/parameters/WebhookSignature"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/WebhookEvent"
                - type: object
                  properties:
                    eventType:
                      const: audit.event
                    data:
                      $ref: "#/components/schemas/AuditEvent"
      responses:
        "200":
          description: Acknowledged

# ══════════════════════════════════════════════════════════════════
# COMPONENTS
# ══════════════════════════════════════════════════════════════════

components:

  # ──────────────────────────────────────────────────────────────
  # SECURITY SCHEMES
  # ──────────────────────────────────────────────────────────────

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT access token signed with Ed25519 (FIPS 204 ML-DSA-65 when Go stdlib ships it).
        Obtained via WebAuthn login, CLI device flow, or CI token.

        **JWT Claims:**
        - `sub` — User ID (UUID v4)
        - `tid` — Tenant ID (determines data scope)
        - `services` — Service slugs the tenant has enabled (e.g. `["remote-access"]`)
        - `roles` — Role identifiers within the tenant
        - `permissions` — Permission strings
        - `iat` / `exp` — Issued/expiration timestamps

        Access tokens expire after 15 minutes (configurable).
        Use refresh token to obtain new access tokens.

        **NIST IA-5, SC-13, SC-23.**
      x-nist-controls: [IA-5, SC-13, SC-23]

    AgentToken:
      type: http
      scheme: bearer
      bearerFormat: HMAC-SHA256
      description: |
        Agent authentication token. HMAC-SHA256, per-agent.
        Presented during WebSocket upgrade (`Authorization: Bearer <token>`)
        or in the first CWP HELLO frame over QUIC.

        **NIST IA-2, IA-5.**

    CiToken:
      type: apiKey
      in: header
      name: Authorization
      description: |
        CI/automation token. Scoped, revocable.
        Set as `CONDUIT_TOKEN` environment variable.
        Format: `Bearer <token>` in Authorization header.

  # ──────────────────────────────────────────────────────────────
  # PARAMETERS
  # ──────────────────────────────────────────────────────────────

  parameters:
    CursorParam:
      name: cursor
      in: query
      description: Opaque pagination cursor from a previous response
      schema:
        type: string
        maxLength: 4096

    LimitParam:
      name: limit
      in: query
      description: Number of items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25

    SortParam:
      name: sort
      in: query
      description: "Sort expression. Format: `field:direction` (e.g., `createdAt:desc`)"
      schema:
        type: string
        maxLength: 100
        pattern: "^[a-zA-Z]+:(asc|desc)$"
        default: "createdAt:desc"

    PathUserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    PathGroupId:
      name: groupId
      in: path
      required: true
      schema:
        type: string
        format: uuid


    PathAgentId:
      name: agentId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    PathSessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    PathJobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    PathProviderId:
      name: providerId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    PathSubscriptionId:
      name: subscriptionId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    WebhookEventId:
      name: X-Event-Id
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Idempotency key for deduplication (NIST AU-3)

    WebhookTimestamp:
      name: X-Event-Timestamp
      in: header
      required: true
      schema:
        type: string
        format: date-time
      description: When the event occurred

    WebhookSignature:
      name: X-Webhook-Signature
      in: header
      required: true
      schema:
        type: string
        maxLength: 71
      description: "HMAC-SHA256 signature: `sha256=<hex-digest>` over raw request body"

  # ──────────────────────────────────────────────────────────────
  # RESPONSES
  # ──────────────────────────────────────────────────────────────

  responses:
    BadRequest:
      description: "400 — Invalid request. Unknown JSON fields are rejected."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
        X-Content-Type-Options:
          $ref: "#/components/headers/X-Content-Type-Options"
        Strict-Transport-Security:
          $ref: "#/components/headers/Strict-Transport-Security"

    Unauthorized:
      description: "401 — Authentication required (NIST IA-2)"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
        X-Content-Type-Options:
          $ref: "#/components/headers/X-Content-Type-Options"
        Strict-Transport-Security:
          $ref: "#/components/headers/Strict-Transport-Security"

    Forbidden:
      description: "403 — Insufficient permissions (NIST AC-3, AC-6)"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
        X-Content-Type-Options:
          $ref: "#/components/headers/X-Content-Type-Options"
        Strict-Transport-Security:
          $ref: "#/components/headers/Strict-Transport-Security"

    NotFound:
      description: "404 — Resource not found"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
        X-Content-Type-Options:
          $ref: "#/components/headers/X-Content-Type-Options"
        Strict-Transport-Security:
          $ref: "#/components/headers/Strict-Transport-Security"

    Conflict:
      description: "409 — Resource conflict (NIST SI-10)"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
        X-Content-Type-Options:
          $ref: "#/components/headers/X-Content-Type-Options"
        Strict-Transport-Security:
          $ref: "#/components/headers/Strict-Transport-Security"

    TooManyRequests:
      description: "429 — Rate limit exceeded (NIST AC-7)"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds until rate limit resets
        X-RateLimit-Limit:
          schema:
            type: integer
          description: Maximum requests per window
        X-RateLimit-Remaining:
          schema:
            type: integer
          description: Remaining requests in current window
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
        X-Content-Type-Options:
          $ref: "#/components/headers/X-Content-Type-Options"
        Strict-Transport-Security:
          $ref: "#/components/headers/Strict-Transport-Security"

  # ──────────────────────────────────────────────────────────────
  # HEADERS
  # ──────────────────────────────────────────────────────────────

  headers:
    X-Request-Id:
      description: "Request correlation ID for audit trail (NIST AU-3)"
      schema:
        type: string
        format: uuid

    X-Content-Type-Options:
      description: "Prevents MIME type sniffing (NIST SC-18)"
      schema:
        type: string
        const: nosniff

    Strict-Transport-Security:
      description: "Enforce HTTPS (NIST SC-8). max-age=63072000 (2 years)."
      schema:
        type: string
        example: "max-age=63072000; includeSubDomains; preload"

  # ──────────────────────────────────────────────────────────────
  # SCHEMAS
  # ──────────────────────────────────────────────────────────────

  schemas:

    # ── Error ──

    ProblemDetail:
      type: object
      description: "RFC 9457 Problem Details for HTTP APIs"
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          description: URI identifying the problem type
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri
        traceId:
          type: string
          description: "Distributed tracing ID (NIST AU-3)"
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string
              code:
                type: string

    # ── Pagination ──

    PaginatedResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: {}
        pagination:
          $ref: "#/components/schemas/CursorPagination"

    CursorPagination:
      type: object
      required: [hasMore]
      properties:
        hasMore:
          type: boolean
        nextCursor:
          type:
            - string
            - "null"
        prevCursor:
          type:
            - string
            - "null"
        totalCount:
          type:
            - integer
            - "null"
          description: Total count (may be omitted for performance on large collections)

    # ── Auth ──

    AuthTokenResponse:
      type: object
      required: [accessToken, refreshToken, expiresIn, tokenType]
      properties:
        accessToken:
          type: string
          description: JWT signed with Ed25519 (FIPS 204 ML-DSA-65 future)
        refreshToken:
          type: string
        expiresIn:
          type: integer
          description: Access token lifetime in seconds
          example: 900
        tokenType:
          type: string
          const: Bearer
        user:
          $ref: "#/components/schemas/User"

    WebAuthnCreationOptions:
      type: object
      description: PublicKeyCredentialCreationOptions per WebAuthn spec
      required: [publicKey]
      properties:
        publicKey:
          type: object
          required: [rp, user, challenge, pubKeyCredParams]
          properties:
            rp:
              type: object
              required: [name, id]
              properties:
                name:
                  type: string
                id:
                  type: string
            user:
              type: object
              required: [id, name, displayName]
              properties:
                id:
                  type: string
                  format: base64url
                name:
                  type: string
                displayName:
                  type: string
            challenge:
              type: string
              format: base64url
            pubKeyCredParams:
              type: array
              items:
                type: object
                required: [type, alg]
                properties:
                  type:
                    type: string
                    const: public-key
                  alg:
                    type: integer
                    description: COSE algorithm identifier
            timeout:
              type: integer
            excludeCredentials:
              type: array
              items:
                type: object
                properties:
                  type:
                    type: string
                  id:
                    type: string
                    format: base64url
            authenticatorSelection:
              type: object
              properties:
                authenticatorAttachment:
                  type: string
                  enum: [platform, cross-platform]
                residentKey:
                  type: string
                  enum: [required, preferred, discouraged]
                userVerification:
                  type: string
                  enum: [required, preferred, discouraged]
            attestation:
              type: string
              enum: [none, indirect, direct, enterprise]

    WebAuthnRequestOptions:
      type: object
      description: PublicKeyCredentialRequestOptions per WebAuthn spec
      required: [publicKey]
      properties:
        publicKey:
          type: object
          required: [challenge]
          properties:
            challenge:
              type: string
              format: base64url
            timeout:
              type: integer
            rpId:
              type: string
            allowCredentials:
              type: array
              items:
                type: object
                properties:
                  type:
                    type: string
                  id:
                    type: string
                    format: base64url
                  transports:
                    type: array
                    items:
                      type: string
            userVerification:
              type: string
              enum: [required, preferred, discouraged]

    WebAuthnRegistrationResponse:
      type: object
      description: Authenticator attestation response
      required: [id, rawId, type, response]
      additionalProperties: false
      properties:
        id:
          type: string
          format: base64url
          maxLength: 1024
        rawId:
          type: string
          format: base64url
          maxLength: 1024
        type:
          type: string
          const: public-key
        response:
          type: object
          required: [clientDataJSON, attestationObject]
          additionalProperties: false
          properties:
            clientDataJSON:
              type: string
              format: base64url
              maxLength: 65536
            attestationObject:
              type: string
              format: base64url
              maxLength: 65536

    WebAuthnAssertionResponse:
      type: object
      description: Authenticator assertion response
      required: [id, rawId, type, response]
      additionalProperties: false
      properties:
        id:
          type: string
          format: base64url
          maxLength: 1024
        rawId:
          type: string
          format: base64url
          maxLength: 1024
        type:
          type: string
          const: public-key
        response:
          type: object
          required: [clientDataJSON, authenticatorData, signature]
          additionalProperties: false
          properties:
            clientDataJSON:
              type: string
              format: base64url
              maxLength: 65536
            authenticatorData:
              type: string
              format: base64url
              maxLength: 1024
            signature:
              type: string
              format: base64url
              maxLength: 1024
            userHandle:
              type:
                - string
                - "null"
              format: base64url
              maxLength: 1024

    PasskeyCredential:
      type: object
      required: [credentialId, algorithm, authenticatorType, createdAt]
      properties:
        credentialId:
          type: string
          format: base64url
        algorithm:
          type: string
          example: "ECDSA-P256"
        algorithmWarning:
          type:
            - string
            - "null"
          description: Non-null if classical (quantum-vulnerable) algorithm
        authenticatorType:
          type: string
          enum: [platform, cross-platform]
        signCount:
          type: integer
          description: Signature counter for clone detection (WebAuthn spec)
        displayName:
          type: string
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type:
            - string
            - "null"
          format: date-time

    CiToken:
      type: object
      required: [id, name, scopes, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
        expiresAt:
          type:
            - string
            - "null"
          format: date-time
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type:
            - string
            - "null"
          format: date-time
        createdBy:
          type: string
          format: uuid

    SsoProvider:
      type: object
      required: [id, name, protocol, enabled, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        protocol:
          type: string
          enum: [saml, oidc]
        enabled:
          type: boolean
        issuer:
          type: string
        metadataUrl:
          type:
            - string
            - "null"
          format: uri
        clientId:
          type:
            - string
            - "null"
        createdAt:
          type: string
          format: date-time

    SsoProviderCreate:
      type: object
      required: [name, protocol]
      properties:
        name:
          type: string
          maxLength: 255
        protocol:
          type: string
          enum: [saml, oidc]
        enabled:
          type: boolean
          default: true
        issuer:
          type: string
          maxLength: 2048
        metadataUrl:
          type: string
          format: uri
          maxLength: 2048
          description: SAML metadata URL or OIDC discovery URL
        clientId:
          type: string
          maxLength: 255
          description: OIDC client ID
        clientSecret:
          type: string
          maxLength: 1024
          writeOnly: true
          description: OIDC client secret (encrypted at rest with AES-256-GCM)
        samlCertificate:
          type: string
          maxLength: 65536
          description: SAML IdP signing certificate (PEM)
        attributeMapping:
          type: object
          properties:
            email:
              type: string
              maxLength: 255
              default: email
            firstName:
              type: string
              maxLength: 255
              default: given_name
            lastName:
              type: string
              maxLength: 255
              default: family_name
      additionalProperties: false

    # ── Sessions ──

    Session:
      type: object
      required: [id, type, createdAt, lastActiveAt, sourceIp]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [web, cli, ci]
        userId:
          type: string
          format: uuid
        sourceIp:
          type: string
        userAgent:
          type: string
        createdAt:
          type: string
          format: date-time
        lastActiveAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time

    # ── Users ──

    User:
      type: object
      required: [id, email, firstName, lastName, role, status, tenantId, createdAt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        tenantId:
          type: string
          format: uuid
          readOnly: true
          description: "Owning tenant (NIST AC-3 — data isolation)"
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        displayName:
          type: string
        role:
          type: string
          enum: [platform_owner, org_owner, org_admin, org_member]
          description: |
            User's role. `platform_owner` is set at setup time only and cannot be
            assigned via the API. Create/update operations accept only
            `org_owner`, `org_admin`, `org_member`.
        status:
          type: string
          enum: [active, suspended, invited]
        passkeyCount:
          type: integer
          description: Number of registered passkeys
        groupIds:
          type: array
          items:
            type: string
            format: uuid
        lastLoginAt:
          type:
            - string
            - "null"
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string
          format: uuid
          readOnly: true
          description: "User who created this account (NIST AU-3)"

    UserCreate:
      type: object
      required: [email, firstName, lastName, role]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        displayName:
          type: string
          maxLength: 255
        role:
          type: string
          enum: [org_owner, org_admin, org_member]
        groupIds:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 100
      additionalProperties: false

    UserUpdate:
      type: object
      properties:
        firstName:
          type: string
          maxLength: 100
        lastName:
          type: string
          maxLength: 100
        displayName:
          type: string
          maxLength: 255
        role:
          type: string
          enum: [org_owner, org_admin, org_member]
        groupIds:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 100
      additionalProperties: false

    # ── Groups ──

    Group:
      type: object
      required: [id, name, tenantId, createdAt]
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        memberCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    GroupCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 1000
      additionalProperties: false

    GroupUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 1000
      additionalProperties: false

    # ── RBAC ──

    Role:
      type: object
      required: [id, name, level, permissions]
      properties:
        id:
          type: string
        name:
          type: string
          enum: [platform_owner, org_owner, org_admin, org_member]
        level:
          type: integer
          description: "Hierarchy level (lower = more privileged)"
        description:
          type: string
        permissions:
          type: array
          items:
            type: string

    RoleAssignment:
      type: object
      description: |
        Assigns a role to a user or group within a scope.
        Exactly one of `userId` or `groupId` must be set (not both, not neither).
        NIST AC-3, AC-6 — access enforcement, least privilege.
      required: [id, role, createdAt]
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
        userId:
          type:
            - string
            - "null"
          format: uuid
          description: "User this role is assigned to (null if assigned to group)"
        groupId:
          type:
            - string
            - "null"
          format: uuid
          description: "Group this role is assigned to (null if assigned to user)"
        scope:
          type: string
          description: "Resource scope — specific agent UUID, or `all` for all agents"
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
          format: uuid

    RoleAssignmentCreate:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [org_owner, org_admin, org_member]
        userId:
          type: string
          format: uuid
        groupId:
          type: string
          format: uuid
        scope:
          type: string
          maxLength: 255
      additionalProperties: false

    # ── Agents ──

    Agent:
      type: object
      required: [id, hostname, os, arch, status, tenantId, createdAt]
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        hostname:
          type: string
        displayName:
          type:
            - string
            - "null"
        os:
          type: string
          enum: [linux, windows, darwin]
        arch:
          type: string
          enum: [amd64, arm64]
          description: |
            Supported build targets: linux/amd64, linux/arm64, windows/amd64, darwin/arm64.
        version:
          type: string
          description: Agent binary version
        status:
          type: string
          enum: [online, offline, stale]
        transport:
          type:
            - string
            - "null"
          enum: [quic, websocket, null]
          description: Current transport type
        ip:
          type: string
          description: Remote IP address
        labels:
          type: object
          additionalProperties:
            type: string
        groupIds:
          type: array
          items:
            type: string
            format: uuid
        cpuPercent:
          type:
            - number
            - "null"
        memoryPercent:
          type:
            - number
            - "null"
        diskPercent:
          type:
            - number
            - "null"
        lastSeenAt:
          type:
            - string
            - "null"
          format: date-time
        connectedAt:
          type:
            - string
            - "null"
          format: date-time
        createdAt:
          type: string
          format: date-time

    AgentDetail:
      allOf:
        - $ref: "#/components/schemas/Agent"
        - type: object
          properties:
            systemInfo:
              type: object
              properties:
                cpuModel:
                  type: string
                cpuCores:
                  type: integer
                memoryTotalBytes:
                  type: integer
                  format: int64
                memoryUsedBytes:
                  type: integer
                  format: int64
                diskTotalBytes:
                  type: integer
                  format: int64
                diskUsedBytes:
                  type: integer
                  format: int64
                osVersion:
                  type: string
                kernelVersion:
                  type: string
                uptime:
                  type: string
                uptimeSeconds:
                  type: integer
                  format: int64
            networkInterfaces:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  ipAddresses:
                    type: array
                    items:
                      type: string
                  macAddress:
                    type: string
                  speed:
                    type: string
                  status:
                    type: string
                    enum: [up, down]
            runningServices:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  status:
                    type: string
                    enum: [running, stopped, unknown]
                  pid:
                    type:
                      - integer
                      - "null"
            openPorts:
              type: array
              items:
                type: object
                properties:
                  port:
                    type: integer
                  protocol:
                    type: string
                    enum: [tcp, udp]
                  process:
                    type: string
                  state:
                    type: string
            connectionHistory:
              type: array
              items:
                type: object
                properties:
                  connectedAt:
                    type: string
                    format: date-time
                  disconnectedAt:
                    type:
                      - string
                      - "null"
                    format: date-time
                  transport:
                    type: string
                    enum: [quic, websocket]
                  duration:
                    type: string

    AgentMetrics:
      type: object
      required: [agentId, period]
      properties:
        agentId:
          type: string
          format: uuid
        period:
          type: string
        cpu:
          type: array
          items:
            $ref: "#/components/schemas/MetricDataPoint"
        memory:
          type: array
          items:
            $ref: "#/components/schemas/MetricDataPoint"
        disk:
          type: array
          items:
            $ref: "#/components/schemas/MetricDataPoint"
        network:
          type: object
          properties:
            rxBytes:
              type: array
              items:
                $ref: "#/components/schemas/MetricDataPoint"
            txBytes:
              type: array
              items:
                $ref: "#/components/schemas/MetricDataPoint"

    MetricDataPoint:
      type: object
      required: [timestamp, value]
      properties:
        timestamp:
          type: string
          format: date-time
        value:
          type: number

    JoinToken:
      type: object
      required: [id, name, type, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
          enum: [single_use, persistent]
        token:
          type: string
          description: |
            Token value. Returned ONLY in the 201 creation response.
            Never included in list or get responses. Cannot be retrieved again.
        labels:
          type: object
          additionalProperties:
            type: string
            maxLength: 255
          maxProperties: 50
        usedCount:
          type: integer
        maxUses:
          type:
            - integer
            - "null"
        expiresAt:
          type:
            - string
            - "null"
          format: date-time
        revoked:
          type: boolean
          readOnly: true
          description: Whether this token has been revoked
        revokedAt:
          type:
            - string
            - "null"
          format: date-time
          readOnly: true
          description: Timestamp when the token was revoked (null if not revoked)
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
          format: uuid

    # ── Shell ──

    ShellSession:
      type: object
      required: [id, agentId, userId, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        agentId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        status:
          type: string
          enum: [active, closed]
        shell:
          type: string
        cols:
          type: integer
        rows:
          type: integer
        recording:
          type: boolean
        websocketUrl:
          type: string
          description: Relative WebSocket URL for this session
        createdAt:
          type: string
          format: date-time
        closedAt:
          type:
            - string
            - "null"
          format: date-time

    ShellRecording:
      type: object
      required: [id, sessionId, agentId, userId, duration, createdAt]
      properties:
        id:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
          description: Shell session that produced this recording
        agentId:
          type: string
          format: uuid
        agentHostname:
          type: string
        userId:
          type: string
          format: uuid
        userEmail:
          type: string
        duration:
          type: integer
          description: Duration in seconds
        sizeBytes:
          type: integer
          format: int64
        format:
          type: string
          const: asciicast-v2
        createdAt:
          type: string
          format: date-time

    # ── Files ──

    FileEntry:
      type: object
      required: [name, type, size, modifiedAt]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [file, directory, symlink]
        size:
          type: integer
          format: int64
        permissions:
          type: string
          example: "-rw-r--r--"
        owner:
          type: string
        group:
          type: string
        modifiedAt:
          type: string
          format: date-time
        isHidden:
          type: boolean

    # ── Bulk Operations ──

    BulkTargets:
      type: object
      description: "Target selection for bulk operations. At least one selector required."
      properties:
        agentIds:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 1000
          description: Explicit agent IDs
        labels:
          type: object
          additionalProperties:
            type: string
            maxLength: 255
          maxProperties: 50
          description: "Label selectors (AND'd). Example: {env: production, role: webserver}"
        groupIds:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 100
          description: All agents in these groups
        all:
          type: boolean
          default: false
          description: Target all agents (requires `confirmAll` to be true)
        confirmAll:
          type: boolean
          default: false
          description: |
            Must be `true` when `all` is `true`. Server rejects the request if
            `all: true` without `confirmAll: true` (NIST AC-6 — prevent accidental
            broad-scope operations).
      additionalProperties: false

    BulkExecJob:
      type: object
      required: [id, command, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        command:
          type: string
        status:
          type: string
          enum: [pending, running, completed, cancelled, failed]
        targetCount:
          type: integer
        completedCount:
          type: integer
        failedCount:
          type: integer
        results:
          type: array
          items:
            type: object
            required: [agentId, status]
            properties:
              agentId:
                type: string
                format: uuid
              hostname:
                type: string
              status:
                type: string
                enum: [pending, running, completed, failed, timeout]
              exitCode:
                type:
                  - integer
                  - "null"
              stdout:
                type: string
              stderr:
                type: string
              duration:
                type: number
                description: Execution time in seconds
        createdAt:
          type: string
          format: date-time
        completedAt:
          type:
            - string
            - "null"
          format: date-time
        createdBy:
          type: string
          format: uuid

    DeployJob:
      type: object
      required: [id, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [uploading, deploying, completed, failed]
        targetCount:
          type: integer
        completedCount:
          type: integer
        failedCount:
          type: integer
        destinationPath:
          type: string
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
          format: uuid

    # ── Audit ──

    AuditEvent:
      type: object
      description: |
        Immutable audit log entry. NIST AU-2, AU-3.
        Who, what, when, where, outcome.
      required: [id, eventType, timestamp, tenantId, outcome]
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        eventType:
          type: string
          description: "Event type (e.g., auth.login.webauthn, shell.session.started)"
          example: "auth.login.webauthn"
        timestamp:
          type: string
          format: date-time
        userId:
          type:
            - string
            - "null"
          format: uuid
          description: User who performed the action
        userEmail:
          type:
            - string
            - "null"
        agentId:
          type:
            - string
            - "null"
          format: uuid
        agentHostname:
          type:
            - string
            - "null"
        sourceIp:
          type: string
        userAgent:
          type:
            - string
            - "null"
        outcome:
          type: string
          enum: [success, failure]
        details:
          type: object
          description: Event-specific details
          additionalProperties: true
        algorithmUsed:
          type:
            - string
            - "null"
          description: Cryptographic algorithm used (logged per NIST SP 800-131A)
        algorithmWarning:
          type:
            - string
            - "null"
          description: Non-null if classical algorithm where PQC was available

    # ── Webhooks ──

    WebhookEvent:
      type: object
      description: Base webhook event envelope
      required: [eventId, eventType, occurredAt, tenantId]
      properties:
        eventId:
          type: string
          format: uuid
        eventType:
          type: string
        occurredAt:
          type: string
          format: date-time
        tenantId:
          type: string
          format: uuid

    WebhookSubscription:
      type: object
      required: [id, url, events, enabled, createdAt]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
          description: "Event types to receive (e.g., agent.connected, auth.login, audit.*)"
        enabled:
          type: boolean
        secret:
          type: string
          description: |
            HMAC-SHA256 signing secret. Returned ONLY in the 201 creation response.
            Never included in list or get responses. Cannot be retrieved again.
        lastDeliveryAt:
          type:
            - string
            - "null"
          format: date-time
        lastDeliveryStatus:
          type:
            - string
            - "null"
          enum: [success, failed, null]
        createdBy:
          type: string
          format: uuid
          readOnly: true
        createdAt:
          type: string
          format: date-time

    WebhookSubscriptionCreate:
      type: object
      required: [url, events]
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
          description: |
            Endpoint to receive webhook events. All payloads are signed with HMAC-SHA256.

            **Production mode (NIST SC-8):** HTTPS only. Valid TLS certificate required.
            HTTP URLs are rejected. Self-signed certificates are rejected.

            **Dev mode (`--dev`):** Two relaxations for local testing:
            - `http://localhost` and `http://127.0.0.1` are permitted (loopback only —
              traffic never leaves the machine, same trust model as the setup wizard
              on localhost:8080 per NIST IA-12).
            - `https://` with self-signed certificates is accepted (TLS verification
              skipped on webhook delivery, consistent with `--dev-insecure` for agent joins).
            - All other HTTP URLs are still rejected, even in dev mode.

            Webhook deliveries are audit-logged regardless of mode.

            **SSRF Prevention (OWASP A10, API7):**
            - Internal IPs blocked in production (127/8, 10/8, 172.16/12, 192.168/16)
            - Cloud metadata endpoints blocked (169.254.169.254)
            - HTTP redirects disabled on webhook delivery
            - URL scheme restricted to https:// (production) or http://localhost (dev)
        events:
          type: array
          items:
            type: string
            maxLength: 100
          minItems: 1
          maxItems: 50
          description: |
            Event types to subscribe to. Supports wildcards:
            - `agent.*` — all agent events
            - `auth.*` — all auth events
            - `audit.*` — all audit events
            - `shell.*`, `file.*`, `user.*`
        enabled:
          type: boolean
          default: true
        secret:
          type: string
          minLength: 32
          maxLength: 512
          writeOnly: true
          description: HMAC-SHA256 signing secret. Auto-generated if omitted.
      additionalProperties: false

    WebhookSubscriptionUpdate:
      type: object
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
          description: |
            Endpoint to receive webhook events. See WebhookSubscriptionCreate
            for URL validation rules per mode.
        events:
          type: array
          items:
            type: string
            maxLength: 100
          minItems: 1
          maxItems: 50
          description: |
            Event types to subscribe to. Supports wildcards:
            - `agent.*` — all agent events
            - `auth.*` — all auth events
            - `audit.*` — all audit events
            - `shell.*`, `file.*`, `user.*`
        enabled:
          type: boolean
        secret:
          type: string
          minLength: 32
          maxLength: 512
          writeOnly: true
          description: HMAC-SHA256 signing secret. Replaces existing secret.
      additionalProperties: false

    WebhookDelivery:
      type: object
      required: [id, subscriptionId, eventType, status, attemptedAt]
      properties:
        id:
          type: string
          format: uuid
        subscriptionId:
          type: string
          format: uuid
        eventType:
          type: string
        status:
          type: string
          enum: [success, failed, pending]
        httpStatus:
          type:
            - integer
            - "null"
        responseTime:
          type:
            - integer
            - "null"
          description: Response time in milliseconds
        attemptNumber:
          type: integer
        nextRetryAt:
          type:
            - string
            - "null"
          format: date-time
        deliveredAt:
          type:
            - string
            - "null"
          format: date-time
          description: Timestamp when the delivery succeeded (null if not yet delivered)
        attemptedAt:
          type: string
          format: date-time

    # ── Services ──

    Service:
      type: object
      description: |
        A service available on the platform. CE ships with one service (`remote-access`).
        The SaaS platform adds more services (Vault, PKI, etc.) as separate entries.
        Middleware checks `jwt.services` includes the required service slug for each endpoint.
      required: [id, slug, name, enabledAt]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          description: "Unique machine-readable identifier (e.g. `remote-access`)"
          example: "remote-access"
        name:
          type: string
          description: "Human-readable service name"
          example: "Conduit Remote Access"
        description:
          type:
            - string
            - "null"
          description: "Service description"
          example: "Secure remote shell, file management, and agent orchestration."
        enabledAt:
          type: string
          format: date-time
          description: "When this service was enabled for the tenant"

    # ── Server Config ──

    ServerConfig:
      type: object
      description: "server.yaml configuration (NIST CM-2)"
      properties:
        domain:
          type: string
        mode:
          type: string
          enum: [standalone]
        listenAddress:
          type: string
        tlsVersion:
          type: string
          const: "1.3"
          description: "Only TLS 1.3 — this is not configurable"
        keyExchange:
          type: string
          const: "X25519MLKEM768"
          description: "PQC hybrid — this is not configurable"
        quicEnabled:
          type: boolean
        http3Enabled:
          type: boolean
        jwtSigningAlgorithm:
          type: string
          enum: [Ed25519, ML-DSA-65]
          description: "Ed25519 Phase 1, ML-DSA-65 when Go stdlib ships it"
        sessionTimeout:
          type: integer
          minimum: 5
          maximum: 1440
          description: Session idle timeout in minutes (5 min to 24 hours)
        accessTokenLifetime:
          type: integer
          minimum: 60
          maximum: 86400
          description: Access token lifetime in seconds (1 min to 24 hours)
        refreshTokenLifetime:
          type: integer
          minimum: 300
          maximum: 2592000
          description: Refresh token lifetime in seconds (5 min to 30 days)
        databasePath:
          type: string
        databaseEncryption:
          type: boolean
          description: App-layer AES-256-GCM encryption on sensitive fields

    ServerConfigUpdate:
      type: object
      properties:
        sessionTimeout:
          type: integer
          minimum: 5
          maximum: 1440
        accessTokenLifetime:
          type: integer
          minimum: 60
          maximum: 86400
        refreshTokenLifetime:
          type: integer
          minimum: 300
          maximum: 2592000
      additionalProperties: false


