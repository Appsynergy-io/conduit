          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteGroup
      summary: Delete group
      tags: [Groups]
      x-audit-event: group.deleted
      parameters:
        - $ref: "#/components/parameters/PathGroupId"
      responses:
        "204":
          description: Group deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /groups/{groupId}/members:
    get:
      operationId: listGroupMembers
      summary: List group members
      tags: [Groups]
      parameters:
        - $ref: "#/components/parameters/PathGroupId"
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: Group members
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: addGroupMember
      summary: Add user to group
      tags: [Groups]
      x-audit-event: group.member_added
      parameters:
        - $ref: "#/components/parameters/PathGroupId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId:
                  type: string
                  format: uuid
              additionalProperties: false
      responses:
        "201":
          description: Member added
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: User already in group

  /groups/{groupId}/members/{userId}:
    delete:
      operationId: removeGroupMember
      summary: Remove user from group
      tags: [Groups]
      x-audit-event: group.member_removed
      parameters:
        - $ref: "#/components/parameters/PathGroupId"
        - $ref: "#/components/parameters/PathUserId"
      responses:
        "204":
          description: Member removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ════════════════════════════════════════════════════════════════
  # RBAC
  # ════════════════════════════════════════════════════════════════

  /rbac/roles:
    get:
      operationId: listRoles
      summary: List available roles
      description: |
        Returns the role hierarchy. Roles:
        - `platform_owner` — full platform access (AppSynergy operator)
        - `org_owner` — full tenant access
        - `org_admin` — tenant admin (user/group/config management)
        - `org_member` — standard user (access granted resources)

        **NIST AC-3, AC-6:** Access enforcement, least privilege.
      tags: [RBAC]
      x-nist-controls: [AC-3, AC-6]
      responses:
        "200":
          description: List of roles
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Role"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /rbac/assignments:
    get:
      operationId: listRoleAssignments
      summary: List role assignments
      tags: [RBAC]
      parameters:
        - name: userId
          in: query
          schema:
            type: string
            format: uuid
        - name: groupId
          in: query
          schema:
            type: string
            format: uuid
        - name: role
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: Role assignments
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/RoleAssignment"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createRoleAssignment
      summary: Assign role to user or group
      tags: [RBAC]
      x-audit-event: rbac.assignment.created
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleAssignmentCreate"
      responses:
        "201":
          description: Role assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleAssignment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /rbac/assignments/{assignmentId}:
    delete:
      operationId: deleteRoleAssignment
      summary: Remove role assignment
      tags: [RBAC]
      x-audit-event: rbac.assignment.deleted
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Assignment removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /rbac/permissions:
    get:
      operationId: listPermissions
      summary: List all permissions
      description: Lists all available permissions that can be assigned via roles.
      tags: [RBAC]
      responses:
        "200":
          description: List of permissions
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, name, description, category]
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        description:
                          type: string
                        category:
                          type: string
                          enum: [agents, shell, files, users, groups, config, audit]
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ════════════════════════════════════════════════════════════════
  # AGENTS
  # ════════════════════════════════════════════════════════════════

  /agents:
    get:
      operationId: listAgents
      summary: List agents
      description: |
        Lists all agents (managed machines) in this instance.
        Shows hostname, OS, IP, transport type (QUIC/WS), CPU, memory,
        disk, connection status, and labels.

        **NIST CM-7, SI-4:** Least functionality and system monitoring.
      tags: [Agents]
      x-nist-controls: [CM-7, SI-4]
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/SortParam"
        - name: status
          in: query
          schema:
            type: string
            enum: [online, offline, stale, all]
            default: all
        - name: transport
          in: query
          schema:
            type: string
            enum: [quic, websocket, all]
            default: all
          description: Filter by transport type (QUIC vs WebSocket)
        - name: os
          in: query
          schema:
            type: string
            enum: [linux, windows, darwin, all]
            default: all
        - name: label
          in: query
          description: |
            Filter by label. Format: `key:value`.
            Multiple labels are AND'd.
          schema:
            type: string
          example: "env:production"
        - name: search
          in: query
          description: Search by hostname, IP, or label
          schema:
            type: string
      responses:
        "200":
          description: Paginated list of agents
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Agent"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /agents/{agentId}:
    get:
      operationId: getAgent
      summary: Get agent details
      description: |
        Full host visibility: CPU, memory, disk, network interfaces,
        running services, open ports, labels, connection history,
        transport type, OS details.
      tags: [Agents]
      parameters:
        - $ref: "#/components/parameters/PathAgentId"
      responses:
        "200":
          description: Full agent details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateAgent
      summary: Update agent metadata
      description: Update agent display name, labels, or group assignments.
      tags: [Agents]
      x-audit-event: agent.updated
      parameters:
        - $ref: "#/components/parameters/PathAgentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
                  maxLength: 255
                labels:
                  type: object
                  additionalProperties:
                    type: string
                  description: Key-value labels for targeting
                  example:
                    env: production
                    region: us-east-1
                    role: webserver
                groupIds:
                  type: array
                  items:
                    type: string
                    format: uuid
              additionalProperties: false
      responses:
        "200":
          description: Agent updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteAgent
      summary: Remove agent registration
      description: |
        Removes agent from the system. Agent will need to re-register
        with a valid join token to reconnect.

        **x-audit-event:** agent.deleted
      tags: [Agents]
      x-audit-event: agent.deleted
      parameters:
        - $ref: "#/components/parameters/PathAgentId"
      responses:
        "204":
          description: Agent removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /agents/join-tokens:
    get:
      operationId: listJoinTokens
      summary: List agent join tokens
      tags: [Agents]
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: List of join tokens
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/JoinToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createJoinToken
      summary: Create agent join token
      description: |
        Creates a join token for agent registration.
        Supports single-use tokens (one agent) and persistent tokens (multiple agents).

        **x-audit-event:** agent.join_token.created
      tags: [Agents]
      x-audit-event: agent.join_token.created
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type]
              properties:
                name:
                  type: string
                  maxLength: 255
                type:
                  type: string
                  enum: [single_use, persistent]
                  description: |
                    `single_use` — consumed after one agent registers.
                    `persistent` — reusable for multiple agents (e.g., auto-enrollment).
                expiresAt:
                  type:
                    - string
                    - "null"
                  format: date-time
                labels:
                  type: object
                  additionalProperties:
                    type: string
                  description: Labels automatically applied to agents that register with this token
                maxUses:
                  type:
                    - integer
                    - "null"
                  description: Maximum number of uses (null for unlimited, persistent tokens only)
              additionalProperties: false
      responses:
        "201":
          description: Join token created — value shown once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinToken"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /agents/join-tokens/{tokenId}:
    delete:
      operationId: revokeJoinToken
      summary: Revoke a join token
      tags: [Agents]
      x-audit-event: agent.join_token.revoked
      parameters:
        - name: tokenId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Token revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /agents/register:
    post:
      operationId: registerAgent
      summary: Register a new agent
      description: |
        Agent registration endpoint. Called by the agent binary during first connection.
        Agent presents a join token. Server validates token, creates agent record,
        and returns an HMAC-SHA256 agent token for future connections.

        **Agent token:** HMAC-SHA256, per-agent, used in subsequent HELLO frames.
        **NIST IA-2, IA-5:** Machine identity establishment.
      tags: [Agents]
      security: []
      x-nist-controls: [IA-2, IA-5]
      x-audit-event: agent.registered
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [joinToken, hostname, os, arch]
              properties:
                joinToken:
                  type: string
                  description: Single-use or persistent join token
                hostname:
                  type: string
                os:
                  type: string
                  enum: [linux, windows, darwin]
                arch:
                  type: string
                  enum: [amd64, arm64]
                version:
                  type: string
                  description: Agent binary version
              additionalProperties: false
      responses:
        "201":
          description: Agent registered — token returned once
          content:
            application/json:
              schema:
                type: object
                required: [agentId, agentToken, masterEndpoints]
                properties:
                  agentId:
                    type: string
                    format: uuid
                  agentToken:
                    type: string
                    description: |
                      HMAC-SHA256 agent token. Shown once.
                      Agent stores this and presents it in HELLO frames on connection.
                  masterEndpoints:
                    type: object
                    required: [quic, websocket]
                    properties:
                      quic:
                        type: string
                        description: "quic://[domain]:443"
                      websocket:
                        type: string
                        description: "wss://[domain]/agent/v1/connect"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Invalid or expired join token
        "409":
          description: Agent already registered

  /agents/{agentId}/metrics:
    get:
      operationId: getAgentMetrics
      summary: Get agent system metrics
      description: |
        Returns time-series metrics for an agent — CPU, RAM, disk, network.
        Data sourced from `AGENT_INFO` CWP frames.
        Stored in VictoriaMetrics or SQLite ring-buffer.

        **NIST SI-4:** System monitoring.
      tags: [Agents, Metrics]
      x-nist-controls: [SI-4]
      parameters:
        - $ref: "#/components/parameters/PathAgentId"
        - name: period
          in: query
          schema:
            type: string
            enum: [1h, 6h, 24h, 7d, 30d]
            default: 24h
        - name: metrics
          in: query
          description: Comma-separated list of metrics to return
          schema:
            type: string
            default: "cpu,memory,disk,network"
      responses:
        "200":
          description: Time-series metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentMetrics"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /agents/{agentId}/update:
    post:
      operationId: triggerAgentUpdate
      summary: Push signed binary update to agent
      description: |
        Triggers an auto-update of the agent binary. The master pushes a
        signed binary (SLH-DSA-SHA2-256s). The agent verifies the signature
        before applying.

        **NIST SI-2, SI-7, FIPS 205:** Flaw remediation and software integrity.
        **x-audit-event:** agent.update.triggered
      tags: [Agents, Binary Signing]
      x-nist-controls: [SI-2, SI-7]
      x-audit-event: agent.update.triggered
      parameters:
        - $ref: "#/components/parameters/PathAgentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                targetVersion:
                  type: string
                  description: Version to update to. If omitted, updates to latest.
                force:
                  type: boolean
                  default: false
                  description: Force update even if agent is already on this version
              additionalProperties: false
      responses:
        "202":
          description: Update initiated
          content:
            application/json:
              schema:
                type: object
                required: [status, targetVersion]
                properties:
                  status:
                    type: string
                    enum: [downloading, verifying, applying, complete, failed]
                  targetVersion:
                    type: string
                  signatureAlgorithm:
                    type: string
                    const: "SLH-DSA-SHA2-256s"
                    description: FIPS 205 post-quantum signature
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /agents/{agentId}/reboot:
    post:
      operationId: rebootAgent
      summary: Reboot agent machine
      description: |
        Sends a reboot command to the agent's host machine.
        Lights-out basic management.

        **x-audit-event:** agent.reboot
      tags: [Agents]
      x-audit-event: agent.reboot
      parameters:
        - $ref: "#/components/parameters/PathAgentId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                delay:
                  type: integer
                  description: Delay in seconds before reboot
                  default: 0
                reason:
                  type: string
                  maxLength: 500
              additionalProperties: false
      responses:
        "202":
          description: Reboot command sent
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /agents/{agentId}/poweroff:
    post:
      operationId: poweroffAgent
      summary: Power off agent machine
      tags: [Agents]
      x-audit-event: agent.poweroff
      parameters:
        - $ref: "#/components/parameters/PathAgentId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                delay:
                  type: integer
                  default: 0
                reason:
                  type: string
                  maxLength: 500
              additionalProperties: false
      responses:
        "202":
          description: Poweroff command sent
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"


  # ════════════════════════════════════════════════════════════════
  # LABELS
  # ════════════════════════════════════════════════════════════════

  /labels:
    get:
      operationId: listLabels
      summary: List all labels in use
      description: |
        Returns all label keys and values currently in use across agents.
        Used for building filter UIs and targeting bulk operations.
      tags: [Labels]
      responses:
        "200":
          description: Label summary
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [key, values, count]
                      properties:
                        key:
                          type: string
                          example: "env"
                        values:
                          type: array
                          items:
                            type: string
                          example: ["production", "staging", "development"]
                        count:
                          type: integer
                          description: Number of agents with this label key
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ════════════════════════════════════════════════════════════════
  # SHELL & TERMINAL
  # ════════════════════════════════════════════════════════════════

  /agents/{agentId}/shell/sessions:
    get:
      operationId: listShellSessions
      summary: List active shell sessions on agent
      tags: [Shell]
      parameters:
        - $ref: "#/components/parameters/PathAgentId"
      responses:
        "200":
          description: Active shell sessions
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ShellSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createShellSession
      summary: Create a new shell session
      description: |
        Opens a new PTY shell session on the agent.
        Multiple concurrent sessions per agent are supported via CWP multiplexing.
        Session data flows over the WebSocket at `/agents/{agentId}/shell/sessions/{sessionId}/ws`.

        **NIST AU-2, AU-3:** Shell session start logged with user, agent, timestamp.
        **x-audit-event:** shell.session.started
      tags: [Shell]
      x-nist-controls: [AU-2, AU-3]
      x-audit-event: shell.session.started
      parameters:
        - $ref: "#/components/parameters/PathAgentId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                cols:
                  type: integer
                  default: 80
                  description: Terminal width in columns
                rows:
                  type: integer
                  default: 24
                  description: Terminal height in rows
                shell:
                  type: string
                  description: Shell to launch (e.g., /bin/bash, cmd.exe). Defaults to OS default.
                recording:
                  type: boolean
                  default: true
                  description: Enable terminal session recording (asciicast v2)
              additionalProperties: false
      responses:
        "201":
          description: Shell session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShellSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          description: Concurrent session limit reached

  /agents/{agentId}/shell/sessions/{sessionId}:
    delete:
      operationId: terminateShellSession
      summary: Terminate a shell session
      tags: [Shell]
      x-audit-event: shell.session.terminated
      parameters:
        - $ref: "#/components/parameters/PathAgentId"
        - $ref: "#/components/parameters/PathSessionId"
      responses:
        "204":
          description: Session terminated
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /agents/{agentId}/shell/sessions/{sessionId}/ws:
    get:
      operationId: shellWebSocket
      summary: WebSocket for shell session data
      description: |
        Upgrades to WebSocket for bidirectional shell I/O.
        Client sends keystrokes, server sends terminal output.
        Uses xterm.js in browser with full feature parity.

        **CWP frames:** SHELL_DATA (I/O), SHELL_RESIZE (terminal resize).

        **Inbound messages:**
        - `{"type": "input", "data": "<base64>"}` — keyboard input
        - `{"type": "resize", "cols": 120, "rows": 40}` — terminal resize

        **Outbound messages:**
        - `{"type": "output", "data": "<base64>"}` — terminal output
        - `{"type": "exit", "code": 0}` — session ended
      tags: [Shell]
      parameters:
        - $ref: "#/components/parameters/PathAgentId"
        - $ref: "#/components/parameters/PathSessionId"
      responses:
        "101":
          description: WebSocket connection established
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /agents/{agentId}/shell/sessions/{sessionId}/resize:
    post:
      operationId: resizeShellSession
      summary: Resize terminal
      description: Sends a SHELL_RESIZE CWP frame to the agent.
      tags: [Shell]
      parameters:
        - $ref: "#/components/parameters/PathAgentId"
        - $ref: "#/components/parameters/PathSessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cols, rows]
              properties:
                cols:
                  type: integer
                  minimum: 1
                rows:
                  type: integer
                  minimum: 1
              additionalProperties: false
      responses:
        "200":
          description: Resize applied
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /shell/recordings:
    get:
      operationId: listShellRecordings
      summary: List terminal session recordings
      description: |
        Lists recorded terminal sessions in asciicast v2 format.
        Recordings can be played back in the dashboard.
      tags: [Shell]
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: agentId
          in: query
          schema:
            type: string
            format: uuid
        - name: userId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of recordings
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/ShellRecording"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /shell/recordings/{recordingId}:
    get:
      operationId: getShellRecording
      summary: Get recording metadata
      tags: [Shell]
      parameters:
        - name: recordingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Recording metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShellRecording"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /shell/recordings/{recordingId}/data:
    get:
      operationId: getShellRecordingData
      summary: Download recording data (asciicast v2)
      tags: [Shell]
      parameters:
        - name: recordingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Asciicast v2 recording data
          content:
            application/x-asciicast:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ════════════════════════════════════════════════════════════════
  # FILE MANAGEMENT
  # ════════════════════════════════════════════════════════════════

  /agents/{agentId}/files:
    get:
      operationId: listFiles
      summary: List files on agent
      description: |
        Lists files and directories at the specified path on the agent.
        Supports remote filesystem navigation.

        **x-audit-event:** file.listed
      tags: [Files]
      x-audit-event: file.listed
      parameters:
        - $ref: "#/components/parameters/PathAgentId"
        - name: path
          in: query
          required: true
          schema:
            type: string
          description: Absolute path on the agent filesystem
          example: "/var/log"
        - name: showHidden
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Directory listing
          content:
            application/json:
              schema:
                type: object
                required: [path, entries]
                properties:
                  path:
                    type: string
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/FileEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /agents/{agentId}/files/download:
    get:
      operationId: downloadFile
      summary: Download a file from agent
      description: |
        Downloads a file from the agent over HTTPS/QUIC.
        No SFTP protocol dependency.

        **x-audit-event:** file.downloaded
      tags: [Files]
      x-audit-event: file.downloaded
      parameters:
        - $ref: "#/components/parameters/PathAgentId"
        - name: path
          in: query
          required: true
          schema:
            type: string
          description: Absolute path of the file on the agent
      responses:
        "200":
          description: File content
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          headers:
            Content-Disposition:
              schema:
                type: string
            Content-Length:
              schema:
                type: integer
                format: int64
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /agents/{agentId}/files/upload:
    post:
      operationId: uploadFile
      summary: Upload a file to agent
      description: |
        Uploads a file to the agent. Supports resumable uploads
        for large files via the `X-Upload-Id` header.

        File transfer over HTTPS/QUIC — no SFTP dependency.

        **x-audit-event:** file.uploaded
      tags: [Files]
      x-audit-event: file.uploaded
      parameters:
        - $ref: "#/components/parameters/PathAgentId"
        - name: path
          in: query
          required: true
          schema:
            type: string
          description: Target path on the agent filesystem
        - name: X-Upload-Id
          in: header
          schema:
            type: string
            format: uuid
          description: Upload ID for resumable uploads. Omit for new upload.
        - name: Content-Range
          in: header
          schema:
            type: string
          description: Byte range for resumable uploads (e.g., "bytes 0-1048575/10485760")
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Upload complete
          content:
            application/json:
              schema:
                type: object
                required: [path, size]
                properties:
                  path:
                    type: string
                  size:
                    type: integer
                    format: int64
                  checksum:
                    type: string
                    description: SHA-256 checksum
        "202":
          description: Partial upload received (resumable)
          content:
            application/json:
              schema:
                type: object
                required: [uploadId, bytesReceived, totalBytes]
                properties:
                  uploadId:
                    type: string
                    format: uuid
                  bytesReceived:
                    type: integer
                    format: int64
                  totalBytes:
                    type: integer
                    format: int64
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          description: File too large

  /agents/{agentId}/files/delete:
    post:
      operationId: deleteFile
      summary: Delete a file or directory on agent
      tags: [Files]
      x-audit-event: file.deleted
      parameters:
        - $ref: "#/components/parameters/PathAgentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path:
                  type: string
                recursive:
                  type: boolean
                  default: false
                  description: Recursively delete directories
              additionalProperties: false
      responses:
        "204":
          description: File deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /agents/{agentId}/files/rename:
    post:
      operationId: renameFile
      summary: Rename or move a file on agent
      tags: [Files]
      x-audit-event: file.renamed
      parameters:
        - $ref: "#/components/parameters/PathAgentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [oldPath, newPath]
              properties:
                oldPath:
                  type: string
                newPath:
                  type: string
              additionalProperties: false
      responses:
        "200":
          description: File renamed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Destination already exists

  /agents/{agentId}/files/mkdir:
    post:
      operationId: createDirectory
      summary: Create a directory on agent
      tags: [Files]
      x-audit-event: file.mkdir
      parameters:
        - $ref: "#/components/parameters/PathAgentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path:
                  type: string
                parents:
                  type: boolean
                  default: true
                  description: Create parent directories as needed (mkdir -p)
              additionalProperties: false
      responses:
        "201":
          description: Directory created
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Path already exists

  /agents/{agentId}/files/preview:
    get:
      operationId: previewFile
      summary: Preview file content
      description: Returns first N bytes of a file for preview in the browser.
      tags: [Files]
      parameters:
        - $ref: "#/components/parameters/PathAgentId"
        - name: path
          in: query
          required: true
          schema:
            type: string
        - name: maxBytes
          in: query
          schema:
            type: integer
            default: 65536
            maximum: 1048576
      responses:
        "200":
          description: File preview
          content:
            application/json:
              schema:
                type: object
                required: [path, content, truncated, mimeType]
                properties:
                  path:
                    type: string
                  content:
                    type: string
                    description: UTF-8 text content or base64-encoded binary
                  truncated:
                    type: boolean
                  totalSize:
                    type: integer
                    format: int64
                  mimeType:
                    type: string
                  encoding:
                    type: string
                    enum: [utf-8, base64]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ════════════════════════════════════════════════════════════════
  # BULK OPERATIONS
  # ════════════════════════════════════════════════════════════════

  /exec:
    post:
      operationId: bulkExec
      summary: Execute command across multiple agents
      description: |
        Runs a command in parallel across multiple agents selected by
        label, group, or explicit agent IDs. Streams output in real-time.

        **NIST AU-2:** All commands logged per agent.
        **x-audit-event:** exec.bulk.started
      tags: [Bulk Operations]
      x-nist-controls: [AU-2, AU-12]
      x-audit-event: exec.bulk.started
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [command, targets]
              properties:
                command:
                  type: string
                  description: Command to execute
                  example: "uptime"
                targets:
                  $ref: "#/components/schemas/BulkTargets"
                timeout:
                  type: integer
                  description: Per-agent timeout in seconds
                  default: 300
                maxConcurrency:
                  type: integer
                  description: Maximum parallel executions
                  default: 50
                shell:
                  type: string
                  description: Shell to use (e.g., /bin/bash, cmd.exe)
              additionalProperties: false
      responses:
        "202":
          description: Execution started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkExecJob"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /exec/{jobId}:
    get:
      operationId: getBulkExecJob
      summary: Get bulk execution job status
      tags: [Bulk Operations]
      parameters:
        - $ref: "#/components/parameters/PathJobId"
      responses:
        "200":
          description: Job status and results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkExecJob"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /exec/{jobId}/ws:
    get:
      operationId: bulkExecStream
      summary: WebSocket for bulk exec streaming output
      description: |
        Streams command output from all targeted agents in real-time.

        **Outbound messages:**
        - `{"type": "output", "agentId": "...", "data": "..."}` — per-agent output
        - `{"type": "exit", "agentId": "...", "code": 0}` — per-agent completion
        - `{"type": "complete", "summary": {...}}` — all agents done
      tags: [Bulk Operations]
      parameters:
        - $ref: "#/components/parameters/PathJobId"
      responses:
        "101":
          description: WebSocket connection established
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /exec/{jobId}/cancel:
    post:
      operationId: cancelBulkExec
      summary: Cancel a running bulk exec job
      tags: [Bulk Operations]
      x-audit-event: exec.bulk.cancelled
      parameters:
        - $ref: "#/components/parameters/PathJobId"
      responses:
        "200":
          description: Job cancelled
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /deploy:
    post:
      operationId: deployBinary
      summary: Deploy binary to agents
      description: |
        Binary deployment service. Pushes a file to multiple agents
        and optionally executes a post-deploy command.
      tags: [Bulk Operations]
      x-audit-event: deploy.started
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, targets, destinationPath]
              properties:
                file:
                  type: string
                  format: binary
                targets:
                  type: string
                  description: JSON-encoded BulkTargets
                destinationPath:
                  type: string
                  description: Target path on agents
                postDeployCommand:
                  type: string
                  description: Command to run after deployment
                mode:
                  type: string
                  description: File permissions (e.g., "0755")
                  default: "0644"
      responses:
        "202":
          description: Deployment started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeployJob"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ════════════════════════════════════════════════════════════════
  # AUDIT
  # ════════════════════════════════════════════════════════════════

  /audit/events:
    get:
      operationId: listAuditEvents
      summary: Query audit log
      description: |
        Queries the immutable, scoped audit log.
        Every access event is logged: logins, session starts, shell commands,
        file operations, agent connections, permission changes, configuration changes.
        Every use of a classical algorithm where PQC was available is logged.

        Audit logs are append-only and cannot be modified or deleted by tenant users.

        **NIST AU-2, AU-3, AU-6, AU-9, AU-10, AU-12.**
      tags: [Audit]
      x-nist-controls: [AU-2, AU-3, AU-6, AU-9, AU-10, AU-12]
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: eventType
          in: query
          schema:
            type: string
          description: Filter by event type (e.g., "auth.login", "shell.session")
        - name: userId
          in: query
          schema:
            type: string
            format: uuid
        - name: agentId
          in: query
          schema:
            type: string
            format: uuid
        - name: sourceIp
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: outcome
          in: query
          schema:
            type: string
            enum: [success, failure, all]
            default: all
        - name: search
          in: query
          description: Full-text search across audit event details
          schema:
            type: string
      responses:
        "200":
          description: Paginated audit events
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/AuditEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /audit/events/{eventId}:
    get:
      operationId: getAuditEvent
      summary: Get audit event details
      tags: [Audit]
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Audit event details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /audit/export:
    post:
      operationId: exportAuditLog
      summary: Export audit log
      description: Export filtered audit events as CSV or JSON for compliance reporting.
      tags: [Audit]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                format:
                  type: string
                  enum: [csv, json]
                  default: json
                from:
                  type: string
                  format: date-time
                to:
                  type: string
                  format: date-time
                eventTypes:
                  type: array
                  items:
                    type: string
              additionalProperties: false
      responses:
        "200":
          description: Exported audit data
          content:
            application/json:
              schema:
                type: string
                format: binary
            text/csv:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ════════════════════════════════════════════════════════════════
  # WEBHOOKS
  # ════════════════════════════════════════════════════════════════

  /webhooks/subscriptions:
    get:
      operationId: listWebhookSubscriptions
      summary: List webhook subscriptions
      tags: [Webhooks]
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: List of webhook subscriptions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/WebhookSubscription"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createWebhookSubscription
      summary: Create webhook subscription
      description: |
        Registers an HTTPS endpoint to receive audit event webhooks.
        Payloads are signed with HMAC-SHA256.
        At-least-once delivery with exponential backoff retries.

        **x-audit-event:** webhook.subscription.created
      tags: [Webhooks]
      x-audit-event: webhook.subscription.created
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookSubscriptionCreate"
      responses:
        "201":
          description: Subscription created — signing secret shown once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookSubscription"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /webhooks/subscriptions/{subscriptionId}:
    get:
      operationId: getWebhookSubscription
      summary: Get webhook subscription
      tags: [Webhooks]
      parameters:
        - $ref: "#/components/parameters/PathSubscriptionId"
      responses:
        "200":
          description: Subscription details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookSubscription"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateWebhookSubscription
      summary: Update webhook subscription
      tags: [Webhooks]
      x-audit-event: webhook.subscription.updated
      parameters:
        - $ref: "#/components/parameters/PathSubscriptionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookSubscriptionCreate"
      responses:
        "200":
          description: Subscription updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookSubscription"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteWebhookSubscription
      summary: Delete webhook subscription
      tags: [Webhooks]
      x-audit-event: webhook.subscription.deleted
      parameters:
        - $ref: "#/components/parameters/PathSubscriptionId"
      responses:
        "204":
          description: Subscription deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /webhooks/subscriptions/{subscriptionId}/test:
    post:
      operationId: testWebhook
      summary: Send test webhook event
      tags: [Webhooks]
      parameters:
        - $ref: "#/components/parameters/PathSubscriptionId"
      responses:
        "200":
          description: Test event sent
          content:
            application/json:
              schema:
                type: object
                required: [success, statusCode, responseTime]
                properties:
                  success:
                    type: boolean
                  statusCode:
                    type: integer
                  responseTime:
                    type: integer
                    description: Response time in milliseconds
        "401":
          $ref: "#/components/responses/Unauthorized"

  /webhooks/deliveries:
    get:
      operationId: listWebhookDeliveries
      summary: List webhook delivery attempts
      tags: [Webhooks]
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: subscriptionId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
            enum: [success, failed, pending, all]
            default: all
      responses:
        "200":
          description: Delivery history
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/WebhookDelivery"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ════════════════════════════════════════════════════════════════
  # EVENTBUS (WebSocket Real-Time)
  # ════════════════════════════════════════════════════════════════

  /events/stream:
    get:
      operationId: eventBusStream
      summary: WebSocket EventBus for real-time dashboard updates
      description: |
        Upgrades to WebSocket for real-time event streaming.
        All dashboard state updates via this stream — no polling, no manual refresh.

        When an agent connects, a shell session starts, a file upload completes,
        or any state changes — every connected browser sees it immediately.

        **Inbound messages:**
        - `{"type": "subscribe", "channels": ["agents", "shell", "audit"]}` — subscribe
        - `{"type": "unsubscribe", "channels": ["audit"]}` — unsubscribe
        - `{"type": "ping"}` — keepalive

        **Outbound messages:**
        - `{"type": "event", "channel": "agents", "event": "agent.connected", "data": {...}}` — event
        - `{"type": "pong"}` — keepalive response
        - `{"type": "error", "message": "..."}` — error

        **Channels:**
        - `agents` — agent connections, disconnections, status changes
        - `shell` — shell session lifecycle
        - `files` — file operation completions
        - `auth` — login/logout events
        - `audit` — all audit events (requires audit:read permission)
        - `metrics` — agent metric updates
        - `exec` — bulk exec progress
        - `system` — server-level events
      tags: [EventBus]
      parameters:
        - name: channels
          in: query
          description: Comma-separated list of channels to subscribe on connect
          schema:
            type: string
          example: "agents,shell,files"
      responses:
        "101":
          description: WebSocket connection established
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ════════════════════════════════════════════════════════════════
  # SERVER CONFIGURATION
  # ════════════════════════════════════════════════════════════════

  /config:
    get:
      operationId: getServerConfig
      summary: Get server configuration
      description: |
        Returns the current server configuration (server.yaml values).
        Security-sensitive fields are redacted.

        **NIST CM-2, CM-6:** Baseline configuration and settings.
      tags: [Server Config]
      x-nist-controls: [CM-2, CM-6]
      responses:
        "200":
          description: Server configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerConfig"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      operationId: updateServerConfig
      summary: Update server configuration
      description: |
        Updates server configuration. Some changes require restart.
        All config changes are audit-logged.

        **NIST CM-3:** Configuration change control.
        **x-audit-event:** config.updated
      tags: [Server Config]
      x-nist-controls: [CM-3]
      x-audit-event: config.updated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServerConfigUpdate"
      responses:
        "200":
          description: Configuration updated
          content:
            application/json:
              schema:
                type: object
                required: [config, restartRequired]
                properties:
                  config:
                    $ref: "#/components/schemas/ServerConfig"
                  restartRequired:
                    type: boolean
                  changedFields:
                    type: array
                    items:
                      type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ════════════════════════════════════════════════════════════════
  # ACME / TLS
  # ════════════════════════════════════════════════════════════════

  /acme/status:
    get:
      operationId: getAcmeStatus
      summary: Get ACME certificate status
      description: Returns TLS certificate status from Let's Encrypt ACME provisioning.
      tags: [ACME]
      responses:
        "200":
          description: ACME certificate status
          content:
            application/json:
              schema:
                type: object
                required: [domain, issuer, notBefore, notAfter, autoRenew]
                properties:
                  domain:
                    type: string
                  issuer:
                    type: string
                    example: "Let's Encrypt"
                  notBefore:
                    type: string
                    format: date-time
                  notAfter:
                    type: string
                    format: date-time
                  autoRenew:
                    type: boolean
                  algorithm:
                    type: string
                    example: "ECDSA P-256"
                    description: |
                      Let's Encrypt doesn't issue PQC certs yet.
                      ECDSA P-256 is used (ACME constraint).
                  algorithmWarning:
                    type:
                      - string
                      - "null"
                    example: "Classical algorithm — Let's Encrypt does not yet support PQC certificates."
                  daysUntilExpiry:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"

  /acme/renew:
    post:
      operationId: renewAcmeCertificate
      summary: Force ACME certificate renewal
      tags: [ACME]
      x-audit-event: acme.renewed
      responses:
        "202":
          description: Renewal initiated
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ════════════════════════════════════════════════════════════════
  # AGENT CONNECTION (WebSocket/QUIC handshake)
  # ════════════════════════════════════════════════════════════════

  /agent/v1/connect:
    get:
      operationId: agentConnect
      summary: Agent WebSocket connection endpoint (fallback)
      description: |
        WebSocket upgrade endpoint for agent connections when QUIC (UDP) is blocked.
        Agent presents token via `Authorization: Bearer <token>` header during upgrade.

        For QUIC, agents connect to `quic://[domain]:443` and present token
        in the first CWP HELLO frame.

        **CWP Frame Types:** HELLO, AUTH, SHELL_DATA, SHELL_RESIZE,
        FILE_OP, AGENT_INFO, EXEC.

        **Transport precedence:**
        1. QUIC (UDP 443) — preferred, ~5s timeout
        2. WebSocket (TCP 443) — automatic fallback

        This endpoint is NOT a REST API — it upgrades to WebSocket for the
        binary CWP protocol.
      tags: [Agents]
      security:
        - AgentToken: []
      parameters:
        - name: Connection
          in: header
          required: true
          schema:
            type: string
            const: Upgrade
        - name: Upgrade
          in: header
          required: true
          schema:
            type: string
            const: websocket
      responses:
        "101":
          description: WebSocket upgrade — CWP protocol begins
        "401":
          description: Invalid agent token
        "403":
          description: Agent not registered or revoked

# ══════════════════════════════════════════════════════════════════
# WEBHOOKS (Server → External)
# ══════════════════════════════════════════════════════════════════

webhooks:
  agent.connected:
    post:
      operationId: onAgentConnected
      summary: Agent connected event
      description: |
        Fired when an agent establishes a connection to the master.
        Signed with HMAC-SHA256. At-least-once delivery.
      tags: [Webhooks]
      parameters:
        - $ref: "#/components/parameters/WebhookEventId"
        - $ref: "#/components/parameters/WebhookTimestamp"
        - $ref: "#/components/parameters/WebhookSignature"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/WebhookEvent"
                - type: object
                  properties:
                    eventType:
                      const: agent.connected
                    data:
                      type: object
                      required: [agentId, hostname, transport]
                      properties:
                        agentId:
                          type: string
                          format: uuid
                        hostname:
                          type: string
                        transport:
                          type: string
                          enum: [quic, websocket]
                        ip:
                          type: string
      responses:
        "200":
          description: Acknowledged

  agent.disconnected:
    post:
      operationId: onAgentDisconnected
      summary: Agent disconnected event
      tags: [Webhooks]
      parameters:
        - $ref: "#/components/parameters/WebhookEventId"
        - $ref: "#/components/parameters/WebhookTimestamp"
        - $ref: "#/components/parameters/WebhookSignature"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/WebhookEvent"
                - type: object
                  properties:
                    eventType:
                      const: agent.disconnected
                    data:
                      type: object
                      required: [agentId, reason]
                      properties:
                        agentId:
                          type: string
                          format: uuid
                        reason:
                          type: string
      responses:
        "200":
          description: Acknowledged

  auth.login:
    post:
      operationId: onAuthLogin
      summary: User login event
      tags: [Webhooks]
      parameters:
        - $ref: "#/components/parameters/WebhookEventId"
        - $ref: "#/components/parameters/WebhookTimestamp"
        - $ref: "#/components/parameters/WebhookSignature"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/WebhookEvent"
                - type: object
                  properties:
                    eventType:
                      const: auth.login
                    data:
                      type: object
                      required: [userId, method, sourceIp]
                      properties:
                        userId:
                          type: string
                          format: uuid
                        email:
                          type: string
                          format: email
                        method:
                          type: string
                          enum: [webauthn, password, sso, cli_device]
                        sourceIp:
                          type: string
      responses:
        "200":
          description: Acknowledged

  shell.session.started:
    post:
      operationId: onShellSessionStarted
      summary: Shell session started
      tags: [Webhooks]
      parameters:
        - $ref: "#/components/parameters/WebhookEventId"
        - $ref: "#/components/parameters/WebhookTimestamp"
        - $ref: "#/components/parameters/WebhookSignature"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/WebhookEvent"
                - type: object
                  properties:
                    eventType:
                      const: shell.session.started
                    data:
                      type: object
                      required: [sessionId, userId, agentId]
                      properties:
                        sessionId:
                          type: string
                          format: uuid
                        userId:
                          type: string
                          format: uuid
                        agentId:
                          type: string
                          format: uuid
      responses:
        "200":
          description: Acknowledged

  user.created:
    post:
      operationId: onUserCreated
      summary: User created event
      tags: [Webhooks]
      parameters:
        - $ref: "#/components/parameters/WebhookEventId"
        - $ref: "#/components/parameters/WebhookTimestamp"
        - $ref: "#/components/parameters/WebhookSignature"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/WebhookEvent"
                - type: object
                  properties:
                    eventType:
                      const: user.created
                    data:
                      type: object
                      required: [userId, email, role]
                      properties:
                        userId:
                          type: string
                          format: uuid
                        email:
                          type: string
                          format: email
                        role:
                          type: string
      responses:
        "200":
          description: Acknowledged

  user.deleted:
    post:
      operationId: onUserDeleted
      summary: User deleted event (minimal data per NIST SI-12)
      tags: [Webhooks]
      parameters:
        - $ref: "#/components/parameters/WebhookEventId"
        - $ref: "#/components/parameters/WebhookTimestamp"
        - $ref: "#/components/parameters/WebhookSignature"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/WebhookEvent"
                - type: object
                  properties:
                    eventType:
                      const: user.deleted
                    data:
                      type: object
                      required: [userId]
                      properties:
                        userId:
                          type: string
                          format: uuid
      responses:
        "200":
          description: Acknowledged


  audit.event:
    post:
      operationId: onAuditEvent
      summary: Generic audit event webhook
      description: Fired for all audit events if subscribed to `audit.*`.
      tags: [Webhooks]
      parameters:
        - $ref: "#/components/parameters/WebhookEventId"
        - $ref: "#/components/parameters/WebhookTimestamp"
        - $ref: "#/components/parameters/WebhookSignature"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/WebhookEvent"
                - type: object
                  properties:
                    eventType:
                      const: audit.event
                    data:
                      $ref: "#/components/schemas/AuditEvent"
      responses:
        "200":
          description: Acknowledged

# ══════════════════════════════════════════════════════════════════
# COMPONENTS
# ══════════════════════════════════════════════════════════════════

components:

  # ──────────────────────────────────────────────────────────────
  # SECURITY SCHEMES
  # ──────────────────────────────────────────────────────────────

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT access token signed with Ed25519 (FIPS 204 ML-DSA-65 when Go stdlib ships it).
        Obtained via WebAuthn login, CLI device flow, or CI token.

        **JWT Claims:**
        - `sub` — User ID (UUID v4)
        - `tid` — Tenant ID (determines data scope)
        - `roles` — Role identifiers within the tenant
        - `permissions` — Permission strings
        - `iat` / `exp` — Issued/expiration timestamps

        Access tokens expire after 15 minutes (configurable).
        Use refresh token to obtain new access tokens.

        **NIST IA-5, SC-13, SC-23.**
      x-nist-controls: [IA-5, SC-13, SC-23]

    AgentToken:
      type: http
      scheme: bearer
      bearerFormat: HMAC-SHA256
      description: |
        Agent authentication token. HMAC-SHA256, per-agent.
        Presented during WebSocket upgrade (`Authorization: Bearer <token>`)
        or in the first CWP HELLO frame over QUIC.

        **NIST IA-2, IA-5.**

    CiToken:
      type: apiKey
      in: header
      name: Authorization
      description: |
        CI/automation token. Scoped, revocable.
        Set as `CONDUIT_TOKEN` environment variable.
        Format: `Bearer <token>` in Authorization header.

  # ──────────────────────────────────────────────────────────────
  # PARAMETERS
  # ──────────────────────────────────────────────────────────────

  parameters:
    CursorParam:
      name: cursor
      in: query
      description: Opaque pagination cursor from a previous response
      schema:
        type: string

    LimitParam:
      name: limit
      in: query
      description: Number of items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25

    SortParam:
      name: sort
      in: query
      description: "Sort expression. Format: `field:direction` (e.g., `createdAt:desc`)"
      schema:
        type: string
        pattern: "^[a-zA-Z]+:(asc|desc)$"
        default: "createdAt:desc"

    PathUserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    PathGroupId:
      name: groupId
      in: path
      required: true
      schema:
        type: string
        format: uuid


    PathAgentId:
      name: agentId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    PathSessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    PathJobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    PathProviderId:
      name: providerId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    PathSubscriptionId:
      name: subscriptionId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    WebhookEventId:
      name: X-Event-Id
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Idempotency key for deduplication (NIST AU-3)

    WebhookTimestamp:
      name: X-Event-Timestamp
      in: header
      required: true
      schema:
        type: string
        format: date-time
      description: When the event occurred

    WebhookSignature:
      name: X-Webhook-Signature
      in: header
      required: true
      schema:
        type: string
      description: "HMAC-SHA256 signature: `sha256=<hex-digest>` over raw request body"

  # ──────────────────────────────────────────────────────────────
  # RESPONSES
  # ──────────────────────────────────────────────────────────────

  responses:
    BadRequest:
      description: "400 — Invalid request. Unknown JSON fields are rejected."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"

    Unauthorized:
      description: "401 — Authentication required (NIST IA-2)"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"

    Forbidden:
      description: "403 — Insufficient permissions (NIST AC-3, AC-6)"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"

    NotFound:
      description: "404 — Resource not found"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"

    TooManyRequests:
      description: "429 — Rate limit exceeded (NIST AC-7)"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds until rate limit resets
        X-RateLimit-Limit:
          schema:
            type: integer
          description: Maximum requests per window
        X-RateLimit-Remaining:
          schema:
            type: integer
          description: Remaining requests in current window
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"

  # ──────────────────────────────────────────────────────────────
  # HEADERS
  # ──────────────────────────────────────────────────────────────

  headers:
    X-Request-Id:
      description: "Request correlation ID for audit trail (NIST AU-3)"
      schema:
        type: string
        format: uuid

    X-Content-Type-Options:
      description: "Prevents MIME type sniffing (NIST SC-18)"
      schema:
        type: string
        const: nosniff

    Strict-Transport-Security:
      description: "Enforce HTTPS (NIST SC-8). max-age=63072000 (2 years)."
      schema:
        type: string
        example: "max-age=63072000; includeSubDomains; preload"

  # ──────────────────────────────────────────────────────────────
  # SCHEMAS
  # ──────────────────────────────────────────────────────────────

  schemas:

    # ── Error ──

    ProblemDetail:
      type: object
      description: "RFC 9457 Problem Details for HTTP APIs"
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          description: URI identifying the problem type
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri
        traceId:
          type: string
          description: "Distributed tracing ID (NIST AU-3)"
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string
              code:
                type: string

    # ── Pagination ──

    PaginatedResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: {}
        pagination:
          $ref: "#/components/schemas/CursorPagination"

    CursorPagination:
      type: object
      required: [hasMore]
      properties:
        hasMore:
          type: boolean
        nextCursor:
          type:
            - string
            - "null"
        prevCursor:
          type:
            - string
            - "null"
        totalCount:
          type:
            - integer
            - "null"
          description: Total count (may be omitted for performance on large collections)

    # ── Auth ──

    AuthTokenResponse:
      type: object
      required: [accessToken, refreshToken, expiresIn, tokenType]
      properties:
        accessToken:
          type: string
          description: JWT signed with Ed25519 (FIPS 204 ML-DSA-65 future)
        refreshToken:
          type: string
        expiresIn:
          type: integer
          description: Access token lifetime in seconds
          example: 900
        tokenType:
          type: string
          const: Bearer
        user:
          $ref: "#/components/schemas/User"

    WebAuthnCreationOptions:
      type: object
      description: PublicKeyCredentialCreationOptions per WebAuthn spec
      required: [publicKey]
      properties:
        publicKey:
          type: object
          required: [rp, user, challenge, pubKeyCredParams]
          properties:
            rp:
              type: object
              required: [name, id]
              properties:
                name:
                  type: string
                id:
                  type: string
            user:
              type: object
              required: [id, name, displayName]
              properties:
                id:
                  type: string
                  format: base64url
                name:
                  type: string
                displayName:
                  type: string
            challenge:
              type: string
              format: base64url
            pubKeyCredParams:
              type: array
              items:
                type: object
                required: [type, alg]
                properties:
                  type:
                    type: string
                    const: public-key
                  alg:
                    type: integer
                    description: COSE algorithm identifier
            timeout:
              type: integer
            excludeCredentials:
              type: array
              items:
                type: object
                properties:
                  type:
                    type: string
                  id:
                    type: string
                    format: base64url
            authenticatorSelection:
              type: object
              properties:
                authenticatorAttachment:
                  type: string
                  enum: [platform, cross-platform]
                residentKey:
                  type: string
                  enum: [required, preferred, discouraged]
                userVerification:
                  type: string
                  enum: [required, preferred, discouraged]
            attestation:
              type: string
              enum: [none, indirect, direct, enterprise]

    WebAuthnRequestOptions:
      type: object
      description: PublicKeyCredentialRequestOptions per WebAuthn spec
      required: [publicKey]
      properties:
        publicKey:
          type: object
          required: [challenge]
          properties:
            challenge:
              type: string
              format: base64url
            timeout:
              type: integer
            rpId:
              type: string
            allowCredentials:
              type: array
              items:
                type: object
                properties:
                  type:
                    type: string
                  id:
                    type: string
                    format: base64url
                  transports:
                    type: array
                    items:
                      type: string
            userVerification:
              type: string
              enum: [required, preferred, discouraged]

    WebAuthnRegistrationResponse:
      type: object
      description: Authenticator attestation response
      required: [id, rawId, type, response]
      properties:
        id:
          type: string
          format: base64url
        rawId:
          type: string
          format: base64url
        type:
          type: string
          const: public-key
        response:
          type: object
          required: [clientDataJSON, attestationObject]
          properties:
            clientDataJSON:
              type: string
              format: base64url
            attestationObject:
              type: string
              format: base64url

    WebAuthnAssertionResponse:
      type: object
      description: Authenticator assertion response
      required: [id, rawId, type, response]
      properties:
        id:
          type: string
          format: base64url
        rawId:
          type: string
          format: base64url
        type:
          type: string
          const: public-key
        response:
          type: object
          required: [clientDataJSON, authenticatorData, signature]
          properties:
            clientDataJSON:
              type: string
              format: base64url
            authenticatorData:
              type: string
              format: base64url
            signature:
              type: string
              format: base64url
            userHandle:
              type:
                - string
                - "null"
              format: base64url

    PasskeyCredential:
      type: object
      required: [credentialId, algorithm, authenticatorType, createdAt]
      properties:
        credentialId:
          type: string
          format: base64url
        algorithm:
          type: string
          example: "ECDSA-P256"
        algorithmWarning:
          type:
            - string
            - "null"
          description: Non-null if classical (quantum-vulnerable) algorithm
        authenticatorType:
          type: string
          enum: [platform, cross-platform]
        displayName:
          type: string
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type:
            - string
            - "null"
          format: date-time

    CiToken:
      type: object
      required: [id, name, scopes, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
        expiresAt:
          type:
            - string
            - "null"
          format: date-time
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type:
            - string
            - "null"
          format: date-time
        createdBy:
          type: string
          format: uuid

    SsoProvider:
      type: object
      required: [id, name, protocol, enabled, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        protocol:
          type: string
          enum: [saml, oidc]
        enabled:
          type: boolean
        issuer:
          type: string
        metadataUrl:
          type:
            - string
            - "null"
          format: uri
        clientId:
          type:
            - string
            - "null"
        createdAt:
          type: string
          format: date-time

    SsoProviderCreate:
      type: object
      required: [name, protocol]
      properties:
        name:
          type: string
          maxLength: 255
        protocol:
          type: string
          enum: [saml, oidc]
        enabled:
          type: boolean
          default: true
        issuer:
          type: string
        metadataUrl:
          type: string
          format: uri
          description: SAML metadata URL or OIDC discovery URL
        clientId:
          type: string
          description: OIDC client ID
        clientSecret:
          type: string
          writeOnly: true
          description: OIDC client secret (encrypted at rest with AES-256-GCM)
        samlCertificate:
          type: string
          description: SAML IdP signing certificate (PEM)
        attributeMapping:
          type: object
          properties:
            email:
              type: string
              default: email
            firstName:
              type: string
              default: given_name
            lastName:
              type: string
              default: family_name
      additionalProperties: false

    # ── Sessions ──

    Session:
      type: object
      required: [id, type, createdAt, lastActiveAt, sourceIp]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [web, cli, ci]
        userId:
          type: string
          format: uuid
        sourceIp:
          type: string
        userAgent:
          type: string
        createdAt:
          type: string
          format: date-time
        lastActiveAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time

    # ── Users ──

    User:
      type: object
      required: [id, email, firstName, lastName, role, status, tenantId, createdAt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        tenantId:
          type: string
          format: uuid
          readOnly: true
          description: "Owning tenant (NIST AC-3 — data isolation)"
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        displayName:
          type: string
        role:
          type: string
          enum: [platform_owner, org_owner, org_admin, org_member]
        status:
          type: string
          enum: [active, suspended, invited]
        passkeyCount:
          type: integer
          description: Number of registered passkeys
        groupIds:
          type: array
          items:
            type: string
            format: uuid
        lastLoginAt:
          type:
            - string
            - "null"
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string
          format: uuid
          readOnly: true
          description: "User who created this account (NIST AU-3)"

    UserCreate:
      type: object
      required: [email, firstName, lastName, role]
      properties:
        email:
          type: string
          format: email
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        displayName:
          type: string
          maxLength: 255
        role:
          type: string
          enum: [org_owner, org_admin, org_member]
        groupIds:
          type: array
          items:
            type: string
            format: uuid
      additionalProperties: false

    UserUpdate:
      type: object
      properties:
        firstName:
          type: string
          maxLength: 100
        lastName:
          type: string
          maxLength: 100
        displayName:
          type: string
          maxLength: 255
        role:
          type: string
          enum: [org_owner, org_admin, org_member]
        groupIds:
          type: array
          items:
            type: string
            format: uuid
      additionalProperties: false

    # ── Groups ──

    Group:
      type: object
      required: [id, name, tenantId, createdAt]
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        memberCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    GroupCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 1000
      additionalProperties: false

    # ── RBAC ──

    Role:
      type: object
      required: [id, name, level, permissions]
      properties:
        id:
          type: string
        name:
          type: string
          enum: [platform_owner, org_owner, org_admin, org_member]
        level:
          type: integer
          description: "Hierarchy level (lower = more privileged)"
        description:
          type: string
        permissions:
          type: array
          items:
            type: string

    RoleAssignment:
      type: object
      required: [id, role, createdAt]
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
        userId:
          type:
            - string
            - "null"
          format: uuid
        groupId:
          type:
            - string
            - "null"
          format: uuid
        scope:
          type: string
          description: Resource scope (e.g., specific agent, all agents)
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
          format: uuid

    RoleAssignmentCreate:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [org_owner, org_admin, org_member]
        userId:
          type: string
          format: uuid
        groupId:
          type: string
          format: uuid
        scope:
          type: string
      additionalProperties: false

    # ── Agents ──

    Agent:
      type: object
      required: [id, hostname, os, arch, status, tenantId, createdAt]
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        hostname:
          type: string
        displayName:
          type:
            - string
            - "null"
        os:
          type: string
          enum: [linux, windows, darwin]
        arch:
          type: string
          enum: [amd64, arm64]
        version:
          type: string
          description: Agent binary version
        status:
          type: string
          enum: [online, offline, stale]
        transport:
          type:
            - string
            - "null"
          enum: [quic, websocket, null]
          description: Current transport type
        ip:
          type: string
          description: Remote IP address
        labels:
          type: object
          additionalProperties:
            type: string
        groupIds:
          type: array
          items:
            type: string
            format: uuid
        cpuPercent:
          type:
            - number
            - "null"
        memoryPercent:
          type:
            - number
            - "null"
        diskPercent:
          type:
            - number
            - "null"
        lastSeenAt:
          type:
            - string
            - "null"
          format: date-time
        connectedAt:
          type:
            - string
            - "null"
          format: date-time
        createdAt:
          type: string
          format: date-time

    AgentDetail:
      allOf:
        - $ref: "#/components/schemas/Agent"
        - type: object
          properties:
            systemInfo:
              type: object
              properties:
                cpuModel:
                  type: string
                cpuCores:
                  type: integer
                memoryTotalBytes:
                  type: integer
                  format: int64
                memoryUsedBytes:
                  type: integer
                  format: int64
                diskTotalBytes:
                  type: integer
                  format: int64
                diskUsedBytes:
                  type: integer
                  format: int64
                osVersion:
                  type: string
                kernelVersion:
                  type: string
                uptime:
                  type: string
                uptimeSeconds:
                  type: integer
                  format: int64
            networkInterfaces:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  ipAddresses:
                    type: array
                    items:
                      type: string
                  macAddress:
                    type: string
                  speed:
                    type: string
                  status:
                    type: string
                    enum: [up, down]
            runningServices:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  status:
                    type: string
                    enum: [running, stopped, unknown]
                  pid:
                    type:
                      - integer
                      - "null"
            openPorts:
              type: array
              items:
                type: object
                properties:
                  port:
                    type: integer
                  protocol:
                    type: string
                    enum: [tcp, udp]
                  process:
                    type: string
                  state:
                    type: string
            connectionHistory:
              type: array
              items:
                type: object
                properties:
                  connectedAt:
                    type: string
                    format: date-time
                  disconnectedAt:
                    type:
                      - string
                      - "null"
                    format: date-time
                  transport:
                    type: string
                    enum: [quic, websocket]
                  duration:
                    type: string

    AgentMetrics:
      type: object
      required: [agentId, period]
      properties:
        agentId:
          type: string
          format: uuid
        period:
          type: string
        cpu:
          type: array
          items:
            $ref: "#/components/schemas/MetricDataPoint"
        memory:
          type: array
          items:
            $ref: "#/components/schemas/MetricDataPoint"
        disk:
          type: array
          items:
            $ref: "#/components/schemas/MetricDataPoint"
        network:
          type: object
          properties:
            rxBytes:
              type: array
              items:
                $ref: "#/components/schemas/MetricDataPoint"
            txBytes:
              type: array
              items:
                $ref: "#/components/schemas/MetricDataPoint"

    MetricDataPoint:
      type: object
      required: [timestamp, value]
      properties:
        timestamp:
          type: string
          format: date-time
        value:
          type: number

    JoinToken:
      type: object
      required: [id, name, type, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
          enum: [single_use, persistent]
        token:
          type: string
          description: Token value (only included on creation)
        labels:
          type: object
          additionalProperties:
            type: string
        usedCount:
          type: integer
        maxUses:
          type:
            - integer
            - "null"
        expiresAt:
          type:
            - string
            - "null"
          format: date-time
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
          format: uuid

    # ── Shell ──

    ShellSession:
      type: object
      required: [id, agentId, userId, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        agentId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        status:
          type: string
          enum: [active, closed]
        shell:
          type: string
        cols:
          type: integer
        rows:
          type: integer
        recording:
          type: boolean
        websocketUrl:
          type: string
          description: Relative WebSocket URL for this session
        createdAt:
          type: string
          format: date-time
        closedAt:
          type:
            - string
            - "null"
          format: date-time

    ShellRecording:
      type: object
      required: [id, agentId, userId, duration, createdAt]
      properties:
        id:
          type: string
          format: uuid
        agentId:
          type: string
          format: uuid
        agentHostname:
          type: string
        userId:
          type: string
          format: uuid
        userEmail:
          type: string
        duration:
          type: integer
          description: Duration in seconds
        sizeBytes:
          type: integer
          format: int64
        format:
          type: string
          const: asciicast-v2
        createdAt:
          type: string
          format: date-time

    # ── Files ──

    FileEntry:
      type: object
      required: [name, type, size, modifiedAt]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [file, directory, symlink]
        size:
          type: integer
          format: int64
        permissions:
          type: string
          example: "-rw-r--r--"
        owner:
          type: string
        group:
          type: string
        modifiedAt:
          type: string
          format: date-time
        isHidden:
          type: boolean

    # ── Bulk Operations ──

    BulkTargets:
      type: object
      description: "Target selection for bulk operations. At least one selector required."
      properties:
        agentIds:
          type: array
          items:
            type: string
            format: uuid
          description: Explicit agent IDs
        labels:
          type: object
          additionalProperties:
            type: string
          description: "Label selectors (AND'd). Example: {env: production, role: webserver}"
        groupIds:
          type: array
          items:
            type: string
            format: uuid
          description: All agents in these groups
        all:
          type: boolean
          default: false
          description: Target all agents (requires confirmation)

    BulkExecJob:
      type: object
      required: [id, command, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        command:
          type: string
        status:
          type: string
          enum: [pending, running, completed, cancelled, failed]
        targetCount:
          type: integer
        completedCount:
          type: integer
        failedCount:
          type: integer
        results:
          type: array
          items:
            type: object
            required: [agentId, status]
            properties:
              agentId:
                type: string
                format: uuid
              hostname:
                type: string
              status:
                type: string
                enum: [pending, running, completed, failed, timeout]
              exitCode:
                type:
                  - integer
                  - "null"
              stdout:
                type: string
              stderr:
                type: string
              duration:
                type: number
                description: Execution time in seconds
        createdAt:
          type: string
          format: date-time
        completedAt:
          type:
            - string
            - "null"
          format: date-time
        createdBy:
          type: string
          format: uuid

    DeployJob:
      type: object
      required: [id, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [uploading, deploying, completed, failed]
        targetCount:
          type: integer
        completedCount:
          type: integer
        failedCount:
          type: integer
        destinationPath:
          type: string
        createdAt:
          type: string
          format: date-time

    # ── Audit ──

    AuditEvent:
      type: object
      description: |
        Immutable audit log entry. NIST AU-2, AU-3.
        Who, what, when, where, outcome.
      required: [id, eventType, timestamp, tenantId, outcome]
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        eventType:
          type: string
          description: "Event type (e.g., auth.login.webauthn, shell.session.started)"
          example: "auth.login.webauthn"
        timestamp:
          type: string
          format: date-time
        userId:
          type:
            - string
            - "null"
          format: uuid
          description: User who performed the action
        userEmail:
          type:
            - string
            - "null"
        agentId:
          type:
            - string
            - "null"
          format: uuid
        agentHostname:
          type:
            - string
            - "null"
        sourceIp:
          type: string
        userAgent:
          type:
            - string
            - "null"
        outcome:
          type: string
          enum: [success, failure]
        details:
          type: object
          description: Event-specific details
          additionalProperties: true
        algorithmUsed:
          type:
            - string
            - "null"
          description: Cryptographic algorithm used (logged per NIST SP 800-131A)
        algorithmWarning:
          type:
            - string
            - "null"
          description: Non-null if classical algorithm where PQC was available

    # ── Webhooks ──

    WebhookEvent:
      type: object
      description: Base webhook event envelope
      required: [eventId, eventType, occurredAt, tenantId]
      properties:
        eventId:
          type: string
          format: uuid
        eventType:
          type: string
        occurredAt:
          type: string
          format: date-time
        tenantId:
          type: string
          format: uuid

    WebhookSubscription:
      type: object
      required: [id, url, events, enabled, createdAt]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
          description: "Event types to receive (e.g., agent.connected, auth.login, audit.*)"
        enabled:
          type: boolean
        secret:
          type: string
          description: Signing secret — only returned on creation
          writeOnly: true
        lastDeliveryAt:
          type:
            - string
            - "null"
          format: date-time
        lastDeliveryStatus:
          type:
            - string
            - "null"
          enum: [success, failed, null]
        createdAt:
          type: string
          format: date-time

    WebhookSubscriptionCreate:
      type: object
      required: [url, events]
      properties:
        url:
          type: string
          format: uri
          description: HTTPS endpoint to receive events
        events:
          type: array
          items:
            type: string
          minItems: 1
          description: |
            Event types to subscribe to. Supports wildcards:
            - `agent.*` — all agent events
            - `auth.*` — all auth events
            - `audit.*` — all audit events
            - `shell.*`, `file.*`, `user.*`
        enabled:
          type: boolean
          default: true
        secret:
          type: string
          minLength: 32
          writeOnly: true
          description: HMAC-SHA256 signing secret. Auto-generated if omitted.
      additionalProperties: false

    WebhookDelivery:
      type: object
      required: [id, subscriptionId, eventType, status, attemptedAt]
      properties:
        id:
          type: string
          format: uuid
        subscriptionId:
          type: string
          format: uuid
        eventType:
          type: string
        status:
          type: string
          enum: [success, failed, pending]
        httpStatus:
          type:
            - integer
            - "null"
        responseTime:
          type:
            - integer
            - "null"
          description: Response time in milliseconds
        attemptNumber:
          type: integer
        nextRetryAt:
          type:
            - string
            - "null"
          format: date-time
        attemptedAt:
          type: string
          format: date-time

    # ── Server Config ──

    ServerConfig:
      type: object
      description: "server.yaml configuration (NIST CM-2)"
      properties:
        domain:
          type: string
        mode:
          type: string
          enum: [standalone]
        listenAddress:
          type: string
        tlsVersion:
          type: string
          const: "1.3"
          description: "Only TLS 1.3 — this is not configurable"
        keyExchange:
          type: string
          const: "X25519MLKEM768"
          description: "PQC hybrid — this is not configurable"
        quicEnabled:
          type: boolean
        http3Enabled:
          type: boolean
        jwtSigningAlgorithm:
          type: string
          enum: [Ed25519, ML-DSA-65]
          description: "Ed25519 Phase 1, ML-DSA-65 when Go stdlib ships it"
        sessionTimeout:
          type: integer
          description: Session idle timeout in minutes
        accessTokenLifetime:
          type: integer
          description: Access token lifetime in seconds
        refreshTokenLifetime:
          type: integer
          description: Refresh token lifetime in seconds
        databasePath:
          type: string
        databaseEncryption:
          type: boolean
          description: SQLCipher AES-256-GCM encryption

    ServerConfigUpdate:
      type: object
      properties:
        sessionTimeout:
          type: integer
          minimum: 5
        accessTokenLifetime:
          type: integer
          minimum: 60
          maximum: 86400
        refreshTokenLifetime:
          type: integer
          minimum: 300
      additionalProperties: false


