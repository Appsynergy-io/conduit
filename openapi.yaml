  # AUDIT
  # ════════════════════════════════════════════════════════════════

  /audit/events:
    get:
      operationId: listAuditEvents
      summary: Query audit log
      description: |
        Queries the immutable, scoped audit log.
        Every access event is logged: logins, session starts, shell commands,
        file operations, agent connections, permission changes, configuration changes.
        Every use of a classical algorithm where PQC was available is logged.

        Audit logs are append-only and cannot be modified or deleted by tenant users.

        **NIST AU-2, AU-3, AU-6, AU-9, AU-10, AU-12.**
      tags: [Audit]
      x-nist-controls: [AU-2, AU-3, AU-6, AU-9, AU-10, AU-12]
      x-owasp: [A01, A09, API1, API3, API5]
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: eventType
          in: query
          schema:
            type: string
            maxLength: 100
          description: Filter by event type (e.g., "auth.login", "shell.session")
        - name: userId
          in: query
          schema:
            type: string
            format: uuid
        - name: agentId
          in: query
          schema:
            type: string
            format: uuid
        - name: sourceIp
          in: query
          schema:
            type: string
            maxLength: 45
        - name: from
          in: query
          schema:
            type: string
            format: date-time
            maxLength: 35
        - name: to
          in: query
          schema:
            type: string
            format: date-time
            maxLength: 35
        - name: outcome
          in: query
          schema:
            type: string
            enum: [success, failure, all]
            default: all
        - name: search
          in: query
          description: Full-text search across audit event details
          schema:
            type: string
            maxLength: 500
      responses:
        "200":
          description: Paginated audit events
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/AuditEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /audit/events/{eventId}:
    get:
      operationId: getAuditEvent
      summary: Get audit event details
      tags: [Audit]
      x-nist-controls: [AU-9]
      x-owasp: [A01, A09, API1, API3]
      parameters:
