  # SESSIONS
  # ════════════════════════════════════════════════════════════════

  /sessions:
    get:
      operationId: listSessions
      summary: List all authenticated sessions
      description: |
        Lists all active sessions across all auth methods — web, CLI, CI.
        All sessions are visible and individually revocable.

        **NIST AC-11, AC-12:** Session visibility and management.
      tags: [Sessions]
      x-nist-controls: [AC-11, AC-12]
      x-owasp: [A01, API1, API3]
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: type
          in: query
          schema:
            type: string
            enum: [web, cli, ci, all]
            default: all
      responses:
        "200":
          description: List of active sessions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /sessions/{sessionId}:
    delete:
      operationId: revokeSession
      summary: Revoke a specific session
      description: |
        Immediately revokes a specific authenticated session.

        **NIST AC-12:** Session termination.
        **x-audit-event:** session.revoked
      tags: [Sessions]
      x-nist-controls: [AC-12, AU-12]
      x-owasp: [A01, A07, API1]
      x-audit-event: session.revoked
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Session revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /sessions/revoke-all:
    post:
      operationId: revokeAllSessions
      summary: Revoke all sessions except current
      description: |
        Revokes all authenticated sessions for the current user except
        the session making this request.

        **x-audit-event:** session.revoked_all
      tags: [Sessions]
      x-nist-controls: [AC-12, AU-12]
      x-owasp: [A01, A07, API5]
      x-audit-event: session.revoked_all
      responses:
        "200":
          description: All other sessions revoked
          content:
            application/json:
              schema:
                type: object
                required: [revokedCount]
                properties:
                  revokedCount:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

