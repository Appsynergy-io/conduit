  # AGENTS
  # ════════════════════════════════════════════════════════════════

  /agents:
    get:
      operationId: listAgents
      summary: List agents
      description: |
        Lists all agents (managed machines) in this instance.
        Shows hostname, OS, IP, transport type (QUIC/WS), CPU, memory,
        disk, connection status, and labels.

        **NIST CM-7, SI-4:** Least functionality and system monitoring.
      tags: [Agents]
      x-nist-controls: [CM-7, SI-4]
      x-owasp: [A01, API1, API3]
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/SortParam"
        - name: status
          in: query
          schema:
            type: string
            enum: [online, offline, stale]
        - name: transport
          in: query
          schema:
            type: string
            enum: [quic, websocket, all]
            default: all
          description: Filter by transport type (QUIC vs WebSocket)
        - name: os
          in: query
          schema:
            type: string
            enum: [linux, windows, darwin, all]
            default: all
        - name: label
          in: query
          description: |
            Filter by label. Format: `key:value`.
            Multiple labels are AND'd.
          schema:
            type: string
            maxLength: 500
          example: "env:production"
        - name: search
          in: query
          description: Search by hostname, IP, or label
          schema:
            type: string
            maxLength: 500
      responses:
        "200":
          description: Paginated list of agents
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Agent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /agents/{agentId}:
    get:
      operationId: getAgent
      summary: Get agent details
      description: |
        Full host visibility: CPU, memory, disk, network interfaces,
        running services, open ports, labels, connection history,
        transport type, OS details.
      tags: [Agents]
      x-nist-controls: [CM-7, SI-4]
      x-owasp: [A01, API1, API3]
      parameters:
        - $ref: "#/components/parameters/PathAgentId"
      responses:
        "200":
          description: Full agent details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateAgent
      summary: Update agent metadata
      description: Update agent display name, labels, or group assignments.
      tags: [Agents]
      x-nist-controls: [CM-3, AU-12]
      x-owasp: [A01, A03, API1, API3]
      x-audit-event: agent.updated
      parameters:
        - $ref: "#/components/parameters/PathAgentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
                  maxLength: 255
                labels:
                  type: object
                  additionalProperties:
                    type: string
                    maxLength: 255
                  maxProperties: 50
                  description: Key-value labels for targeting
                  example:
                    env: production
                    region: us-east-1
                    role: webserver
                groupIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                  maxItems: 100
              additionalProperties: false
      responses:
        "200":
          description: Agent updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteAgent
      summary: Remove agent registration
      description: |
        Removes agent from the system. Agent will need to re-register
        with a valid join token to reconnect.

        **x-audit-event:** agent.deleted
      tags: [Agents]
      x-nist-controls: [AC-6, AU-12]
      x-owasp: [A01, API1, API5]
      x-audit-event: agent.deleted
      parameters:
        - $ref: "#/components/parameters/PathAgentId"
      responses:
        "204":
          description: Agent removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /agents/join-tokens:
    get:
      operationId: listJoinTokens
      summary: List agent join tokens
      tags: [Agents]
      x-nist-controls: [IA-5]
      x-owasp: [A01, API1, API5]
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: List of join tokens
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/JoinToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createJoinToken
      summary: Create agent join token
      description: |
        Creates a join token for agent registration.
        Supports single-use tokens (one agent) and persistent tokens (multiple agents).

        **x-audit-event:** agent.join_token.created
      tags: [Agents]
      x-nist-controls: [IA-5, AU-12]
      x-owasp: [A01, A02, API2, API5]
      x-audit-event: agent.join_token.created
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type]
              properties:
                name:
                  type: string
                  maxLength: 255
                type:
                  type: string
                  enum: [single_use, persistent]
                  description: |
                    `single_use` — consumed after one agent registers.
                    `persistent` — reusable for multiple agents (e.g., auto-enrollment).
                expiresAt:
                  type:
                    - string
                    - "null"
                  format: date-time
                  maxLength: 35
                labels:
                  type: object
                  additionalProperties:
                    type: string
                    maxLength: 255
                  maxProperties: 50
                  description: Labels automatically applied to agents that register with this token
                maxUses:
                  type:
                    - integer
                    - "null"
                  minimum: 1
                  maximum: 100000
                  description: Maximum number of uses (null for unlimited, persistent tokens only)
              additionalProperties: false
      responses:
        "201":
          description: Join token created — value shown once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinToken"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /agents/join-tokens/{tokenId}:
    delete:
      operationId: revokeJoinToken
      summary: Revoke a join token
      tags: [Agents]
      x-nist-controls: [IA-5, AU-12]
      x-owasp: [A01, API1, API5]
      x-audit-event: agent.join_token.revoked
      parameters:
        - name: tokenId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Token revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /agents/register:
    post:
      operationId: registerAgent
      summary: Register a new agent
      description: |
        Agent registration endpoint. Called by the agent binary during first connection.
        Agent presents a join token. Server validates token, creates agent record,
        and returns an HMAC-SHA256 agent token for future connections.

        **Agent token:** HMAC-SHA256, per-agent, used in subsequent HELLO frames.
        **NIST IA-2, IA-5:** Machine identity establishment.
      tags: [Agents]
      security: []
      x-nist-controls: [IA-2, IA-5]
      x-owasp: [A02, A07, API2]
      x-rate-limit: { window: 1m, limit: 10 }
      x-audit-event: agent.registered
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [joinToken, hostname, os, arch]
              properties:
                joinToken:
                  type: string
                  maxLength: 4096
                  writeOnly: true
                  description: Single-use or persistent join token
                hostname:
                  type: string
                  maxLength: 253
                os:
                  type: string
                  enum: [linux, windows, darwin]
                  description: Agent operating system
                arch:
                  type: string
                  enum: [amd64, arm64]
                  description: |
                    Agent CPU architecture. Supported build targets:
                    linux/amd64, linux/arm64, windows/amd64, darwin/arm64.
                    Other combinations are accepted but no official binaries are provided.
                version:
                  type: string
                  maxLength: 50
                  description: Agent binary version
              additionalProperties: false
      responses:
        "201":
          description: Agent registered — token returned once
          content:
            application/json:
              schema:
                type: object
                required: [agentId, agentToken, serverFingerprint, masterEndpoints]
                properties:
                  agentId:
                    type: string
                    format: uuid
                  agentToken:
                    type: string
                    description: |
                      HMAC-SHA256 agent token. Shown once.
                      Agent stores this and presents it in AUTH frames on connection
                      (separate from the HELLO frame which carries identity only).
                  serverFingerprint:
                    type: string
                    description: SHA-256 fingerprint of the server's public key for TOFU verification
                    example: "sha256:Ab3dEf..."
                  masterEndpoints:
                    type: object
                    required: [quic, websocket]
                    properties:
                      quic:
                        type: string
                        description: "quic://[domain]:443"
                      websocket:
                        type: string
                        description: "wss://[domain]/agent/v1/connect"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Invalid or expired join token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /agents/{agentId}/metrics:
    get:
      operationId: getAgentMetrics
      summary: Get agent system metrics
      description: |
        Returns time-series metrics for an agent — CPU, RAM, disk, network.
        Data sourced from `AGENT_INFO` CWP frames.
        Stored in VictoriaMetrics or SQLite ring-buffer.

        **NIST SI-4:** System monitoring.
      tags: [Agents, Metrics]
      x-nist-controls: [SI-4]
      x-owasp: [A01, API1, API3]
      parameters:
        - $ref: "#/components/parameters/PathAgentId"
        - name: period
          in: query
          schema:
            type: string
            enum: [1h, 6h, 24h, 7d, 30d]
            default: 24h
        - name: metrics
          in: query
          description: Comma-separated list of metrics to return
          schema:
            type: string
            maxLength: 500
            default: "cpu,memory,disk,network"
      responses:
        "200":
          description: Time-series metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentMetrics"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /agents/{agentId}/update:
    post:
      operationId: triggerAgentUpdate
      summary: Push signed binary update to agent
      description: |
        Triggers an auto-update of the agent binary. The master pushes a
        signed binary (SLH-DSA-SHA2-256s). The agent verifies the signature
        before applying.

        **NIST SI-2, SI-7, FIPS 205:** Flaw remediation and software integrity.
        **x-audit-event:** agent.update.triggered
      tags: [Agents, Binary Signing]
      x-nist-controls: [SI-2, SI-7]
      x-owasp: [A01, A08, API1, API5]
      x-audit-event: agent.update.triggered
      parameters:
        - $ref: "#/components/parameters/PathAgentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                targetVersion:
                  type: string
                  maxLength: 50
                  description: Version to update to. If omitted, updates to latest.
                force:
                  type: boolean
                  default: false
                  description: Force update even if agent is already on this version
              additionalProperties: false
      responses:
        "202":
          description: Update initiated
          content:
            application/json:
              schema:
                type: object
                required: [status, targetVersion]
                properties:
                  status:
                    type: string
                    enum: [downloading, verifying, applying, complete, failed]
                  targetVersion:
                    type: string
                  signatureAlgorithm:
                    type: string
                    const: "SLH-DSA-SHA2-256s"
                    description: FIPS 205 post-quantum signature
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /agents/{agentId}/reboot:
    post:
      operationId: rebootAgent
      summary: Reboot agent machine
      description: |
        Sends a reboot command to the agent's host machine.
        Lights-out basic management.

        **NIST AC-6:** Least privilege — requires elevated role.
        **x-audit-event:** agent.reboot
      tags: [Agents]
      x-nist-controls: [AC-6, AU-12]
      x-owasp: [A01, API1, API5, API6]
      x-audit-event: agent.reboot
      parameters:
        - $ref: "#/components/parameters/PathAgentId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                delay:
                  type: integer
                  minimum: 0
                  maximum: 86400
                  description: Delay in seconds before reboot
                  default: 0
                reason:
                  type: string
                  maxLength: 500
              additionalProperties: false
      responses:
        "202":
          description: Reboot command sent
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /agents/{agentId}/poweroff:
    post:
      operationId: poweroffAgent
      summary: Power off agent machine
      description: |
        **NIST AC-6:** Least privilege — requires elevated role.
      tags: [Agents]
      x-nist-controls: [AC-6, AU-12]
      x-owasp: [A01, API1, API5, API6]
      x-audit-event: agent.poweroff
      parameters:
        - $ref: "#/components/parameters/PathAgentId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                delay:
                  type: integer
                  minimum: 0
                  maximum: 86400
                  default: 0
                reason:
                  type: string
                  maxLength: 500
              additionalProperties: false
      responses:
        "202":
          description: Poweroff command sent
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"


  # ════════════════════════════════════════════════════════════════
  # LABELS
  # ════════════════════════════════════════════════════════════════

  /labels:
    get:
      operationId: listLabels
      summary: List all labels in use
      description: |
        Returns all label keys and values currently in use across agents.
        Used for building filter UIs and targeting bulk operations.
      tags: [Labels]
      x-nist-controls: [CM-7]
      x-owasp: [A01, API1]
      responses:
        "200":
          description: Label summary
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [key, values, count]
                      properties:
                        key:
                          type: string
                          example: "env"
                        values:
                          type: array
                          items:
                            type: string
                          example: ["production", "staging", "development"]
                        count:
                          type: integer
                          description: Number of agents with this label key
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ════════════════════════════════════════════════════════════════
  # SHELL & TERMINAL
  # ════════════════════════════════════════════════════════════════

  /agents/{agentId}/shell/sessions:
    get:
      operationId: listShellSessions
      summary: List active shell sessions on agent
      tags: [Shell]
      x-nist-controls: [AU-2]
      x-owasp: [A01, API1, API3]
      parameters:
        - $ref: "#/components/parameters/PathAgentId"
      responses:
        "200":
          description: Active shell sessions
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ShellSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createShellSession
      summary: Create a new shell session
      description: |
        Opens a new PTY shell session on the agent.
        Multiple concurrent sessions per agent are supported via CWP multiplexing.
        Session data flows over the WebSocket at `/agents/{agentId}/shell/sessions/{sessionId}/ws`.

        **NIST AU-2, AU-3:** Shell session start logged with user, agent, timestamp.
        **x-audit-event:** shell.session.started
      tags: [Shell]
      x-nist-controls: [AU-2, AU-3]
      x-owasp: [A01, A03, API1, API5]
      x-audit-event: shell.session.started
      parameters:
        - $ref: "#/components/parameters/PathAgentId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                cols:
                  type: integer
                  default: 80
                  minimum: 1
                  maximum: 10000
                  description: Terminal width in columns
                rows:
                  type: integer
                  default: 24
                  minimum: 1
                  maximum: 10000
                  description: Terminal height in rows
                shell:
                  type: string
                  maxLength: 4096
                  description: Shell to launch (e.g., /bin/bash, cmd.exe). Defaults to OS default.
                recording:
                  type: boolean
                  default: true
                  description: Enable terminal session recording (asciicast v2)
              additionalProperties: false
      responses:
        "201":
          description: Shell session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShellSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          description: Concurrent session limit reached

  /agents/{agentId}/shell/sessions/{sessionId}:
    delete:
      operationId: terminateShellSession
      summary: Terminate a shell session
      tags: [Shell]
      x-nist-controls: [AC-12, AU-12]
      x-owasp: [A01, API1, API5]
      x-audit-event: shell.session.terminated
      parameters:
        - $ref: "#/components/parameters/PathAgentId"
        - $ref: "#/components/parameters/PathSessionId"
      responses:
        "204":
          description: Session terminated
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /agents/{agentId}/shell/sessions/{sessionId}/ws:
    get:
      operationId: shellWebSocket
      summary: WebSocket for shell session data
      description: |
        Upgrades to WebSocket for bidirectional shell I/O.
        Client sends keystrokes, server sends terminal output.
        Uses xterm.js in browser with full feature parity.

        **CWP frames:** SHELL_DATA (I/O), SHELL_RESIZE (terminal resize).

        **Inbound messages:**
        - `{"type": "input", "data": "<base64>"}` — keyboard input
        - `{"type": "resize", "cols": 120, "rows": 40}` — terminal resize

        **Outbound messages:**
        - `{"type": "output", "data": "<base64>"}` — terminal output
        - `{"type": "exit", "code": 0}` — session ended
      tags: [Shell]
      x-nist-controls: [AU-2, AU-3]
      x-owasp: [A01, A03, API1]
      parameters:
        - $ref: "#/components/parameters/PathAgentId"
        - $ref: "#/components/parameters/PathSessionId"
      responses:
        "101":
          description: WebSocket connection established
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /agents/{agentId}/shell/sessions/{sessionId}/resize:
    post:
      operationId: resizeShellSession
      summary: Resize terminal
      description: Sends a SHELL_RESIZE CWP frame to the agent.
      tags: [Shell]
      x-nist-controls: [AU-12]
      x-owasp: [A01, API1, API4]
      x-audit-event: shell.session.resized
      parameters:
        - $ref: "#/components/parameters/PathAgentId"
        - $ref: "#/components/parameters/PathSessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cols, rows]
              properties:
                cols:
                  type: integer
                  minimum: 1
                  maximum: 10000
                rows:
                  type: integer
                  minimum: 1
                  maximum: 10000
              additionalProperties: false
      responses:
        "200":
          description: Resize applied
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /shell/recordings:
    get:
      operationId: listShellRecordings
      summary: List terminal session recordings
      description: |
        Lists recorded terminal sessions in asciicast v2 format.
        Recordings can be played back in the dashboard.
      tags: [Shell]
      x-nist-controls: [AU-9]
      x-owasp: [A01, A09, API1, API3]
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: agentId
          in: query
          schema:
            type: string
            format: uuid
        - name: userId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of recordings
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/ShellRecording"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /shell/recordings/{recordingId}:
    get:
      operationId: getShellRecording
      summary: Get recording metadata
      tags: [Shell]
      x-nist-controls: [AU-9]
      x-owasp: [A01, API1, API3]
      parameters:
        - name: recordingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Recording metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShellRecording"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /shell/recordings/{recordingId}/data:
    get:
      operationId: getShellRecordingData
      summary: Download recording data (asciicast v2)
      tags: [Shell]
      x-nist-controls: [AU-9]
      x-owasp: [A01, API1]
      parameters:
        - name: recordingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Asciicast v2 recording data
          content:
            application/x-asciicast:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ════════════════════════════════════════════════════════════════
  # FILE MANAGEMENT
  # ════════════════════════════════════════════════════════════════

  /agents/{agentId}/files:
    get:
      operationId: listFiles
      summary: List files on agent
      description: |
        Lists files and directories at the specified path on the agent.
        Supports remote filesystem navigation.

        **x-audit-event:** file.listed
      tags: [Files]
      x-nist-controls: [AU-2]
      x-owasp: [A01, A03, API1]
      x-audit-event: file.listed
      parameters:
        - $ref: "#/components/parameters/PathAgentId"
        - name: path
          in: query
          required: true
          schema:
            type: string
            maxLength: 4096
            pattern: "^/"
          description: |
            Absolute path on the agent filesystem.
            Path traversal prevented server-side via filepath.Clean (OWASP A03, V12).
          example: "/var/log"
        - name: showHidden
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Directory listing
          content:
            application/json:
              schema:
                type: object
                required: [path, entries]
                properties:
                  path:
                    type: string
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/FileEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /agents/{agentId}/files/download:
    get:
      operationId: downloadFile
      summary: Download a file from agent
      description: |
        Downloads a file from the agent over HTTPS/QUIC.
        No SFTP protocol dependency.

        **x-audit-event:** file.downloaded
      tags: [Files]
      x-nist-controls: [AU-2, AU-12]
      x-owasp: [A01, A03, API1]
      x-audit-event: file.downloaded
      parameters:
        - $ref: "#/components/parameters/PathAgentId"
        - name: path
          in: query
          required: true
          schema:
            type: string
            maxLength: 4096
            pattern: "^/"
          description: |
            Absolute path of the file on the agent.
            Path traversal prevented server-side via filepath.Clean (OWASP A03, V12).
      responses:
        "200":
          description: File content
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          headers:
            Content-Disposition:
              schema:
                type: string
            Content-Length:
              schema:
                type: integer
                format: int64
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /agents/{agentId}/files/upload:
    post:
      operationId: uploadFile
      summary: Upload a file to agent
      description: |
        Uploads a file to the agent. Supports resumable uploads
        for large files via the `X-Upload-Id` header.

        File transfer over HTTPS/QUIC — no SFTP dependency.

        **x-audit-event:** file.uploaded
      tags: [Files]
      x-nist-controls: [AU-2, AU-12]
      x-owasp: [A01, A03, A10, API1, API4]
      x-audit-event: file.uploaded
      parameters:
        - $ref: "#/components/parameters/PathAgentId"
        - name: path
          in: query
          required: true
          schema:
            type: string
            maxLength: 4096
            pattern: "^/"
          description: |
            Target path on the agent filesystem.
            Path traversal prevented server-side via filepath.Clean (OWASP A03, V12).
        - name: X-Upload-Id
          in: header
          schema:
            type: string
            format: uuid
          description: Upload ID for resumable uploads. Omit for new upload.
        - name: Content-Range
          in: header
          schema:
            type: string
            maxLength: 128
          description: Byte range for resumable uploads (e.g., "bytes 0-1048575/10485760")
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Upload complete
          content:
            application/json:
              schema:
                type: object
                required: [path, size]
                properties:
                  path:
                    type: string
                  size:
                    type: integer
                    format: int64
                  checksum:
                    type: string
                    description: SHA-256 checksum
        "202":
          description: Partial upload received (resumable)
          content:
            application/json:
              schema:
                type: object
                required: [uploadId, bytesReceived, totalBytes]
                properties:
                  uploadId:
                    type: string
                    format: uuid
                  bytesReceived:
                    type: integer
                    format: int64
                  totalBytes:
                    type: integer
                    format: int64
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          description: "File exceeds maximum upload size (default 2GB, configurable)"

