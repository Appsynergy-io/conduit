openapi: "3.1.1"
info:
  title: Conduit CE by AppSynergy — API
  version: "1.0.0"
  summary: Community Edition — remote infrastructure management platform API
  description: |
    Conduit is a remote infrastructure management platform that provides secure,
    instant shell access to any machine — without inbound ports, SSH keys, VPNs,
    or trusting the network.

    ## Security Framework

    This API implements security controls aligned with:
    - **NIST SP 800-53 Rev. 5** — Security and Privacy Controls
    - **NIST SP 800-63B** — Digital Identity Guidelines (AAL2 baseline, AAL3 with hardware authenticator)
    - **NIST SP 800-131A Rev. 2** — Cryptographic Transitions
    - **NIST SP 800-57** — Key Management
    - **FIPS 203 (ML-KEM)** — Post-Quantum Key Encapsulation (X25519MLKEM768 hybrid TLS)
    - **FIPS 204 (ML-DSA)** — Post-Quantum Digital Signatures (JWT signing, future)
    - **FIPS 205 (SLH-DSA)** — Post-Quantum Stateless Hash-Based Signatures (binary signing)

    ## Transport Security

    - **TLS 1.3 mandatory** on all connections. TLS 1.0, 1.1, 1.2 are disabled.
    - **X25519MLKEM768 hybrid PQC** key exchange on all TLS connections.
    - **QUIC primary** (UDP 443) with automatic WebSocket/HTTP fallback (TCP 443).
    - Cipher suites: TLS_AES_256_GCM_SHA384, TLS_AES_128_GCM_SHA256, TLS_CHACHA20_POLY1305_SHA256.

    ## Forbidden Algorithms (NIST SP 800-131A Disallowed)

    MD5, SHA-1, DES, 3DES, RC4, TLS 1.0/1.1/1.2, non-CSPRNG sources.

    ## Community Edition

    This is the CE (Community Edition) API. Single-tenant (UUID generated at setup),
    self-hosted deployment with multiple users and full RBAC. No billing, no sub-tenants,
    no SaaS mode. All records carry a `tenantId` field for transferability to the
    multi-tenant SaaS. The full multi-tenant SaaS API extends this specification.

    ## Service Registry

    CE includes a service abstraction layer. Each endpoint tag has an `x-service`
    extension identifying which service it belongs to. The JWT `services` claim lists
    the services enabled for the tenant. Middleware verifies the JWT includes the
    required service before routing.

    CE ships with one service: `remote-access` (agents, shell, files, bulk ops, metrics,
    labels, binary signing). It is seeded at setup time and auto-granted to the tenant.
    The SaaS platform adds more services (Vault, PKI, etc.) — each as a new entry in
    the `services` table with its own set of `x-service`-tagged endpoints. Platform-level
    tags (Auth, Users, Groups, RBAC, Sessions, Audit, Webhooks, EventBus, Server Config,
    ACME, Services, Health) have no `x-service` and are always accessible.

    ## Authentication

    - **Production:** Passkeys (WebAuthn) only. No passwords.
    - **Setup wizard (production):** Server generates a cryptographic setup token (CSPRNG, 32 bytes, base64url) on first start and prints it to the server process stdout. The token is required for `/setup/configure` and `/setup/passkey`. Deleted permanently after passkey registration. Proves server console access (NIST IA-12).
    - **Dev mode:** Setup token is generated and printed to stdout. After setup, the token is NOT deleted — it persists as the dev mode login credential via `/auth/password/login` (email + setup token as password). This is necessary because WebAuthn requires a secure context (HTTPS with valid cert or localhost origin) which self-signed dev certs may not satisfy. If a passkey is successfully registered in dev mode, both passkey and token auth remain available.
    - **CLI:** Browser-based device flow returns scoped CLI token.
    - **CI/Automation:** `CONDUIT_TOKEN` environment variable with scoped, revocable tokens.
    - **Agents:** HMAC-SHA256 tokens presented during connection handshake.

    ## Input Validation

    Unknown JSON fields are **rejected** on all endpoints (no silent ignore).
    All database queries use parameterized SQL only.

    ## Real-Time Updates

    Dashboard state updates in real-time via the WebSocket EventBus at `/api/v1/events/stream`.
    No polling. No manual refresh.

    ## Security Headers (Middleware-Applied)

    All responses — success and error — include these headers via middleware:
    - `X-Request-Id` — Request correlation ID (NIST AU-3)
    - `X-Content-Type-Options: nosniff` — MIME type sniffing prevention (NIST SC-18)
    - `Strict-Transport-Security: max-age=63072000; includeSubDomains; preload` — HSTS (NIST SC-8)
    - `Cache-Control: no-store` — On sensitive responses (auth, user data, sessions, audit)
    - `X-Frame-Options: DENY` — Clickjacking prevention
    - `Referrer-Policy: strict-origin-when-cross-origin`
    - `Permissions-Policy: camera=(), microphone=(), geolocation=()`
    - `Content-Security-Policy` — Restrictive CSP on HTML responses

    These are enforced at the middleware layer and not repeated on every endpoint definition.
    Error responses reference shared components that document the critical subset.

    ## Content-Type Enforcement

    All POST/PATCH/PUT endpoints require `Content-Type: application/json` (except
    file upload which uses `application/octet-stream` and deploy which uses `multipart/form-data`).
    Requests with unexpected content types are rejected with `415 Unsupported Media Type`.
    Unknown JSON fields are rejected on all endpoints (`additionalProperties: false`).
  contact:
    name: AppSynergy
    url: https://appsynergy.io
  license:
    name: Proprietary
  x-security-framework:
    standards:
      - id: NIST-SP-800-53-R5
        name: NIST SP 800-53 Rev. 5
        description: Security and Privacy Controls for Information Systems
        baseline: Moderate
        controls:
          - id: AC-2
            title: Account Management
            implementation: User lifecycle via /api/v1/users endpoints, passkey-bound accounts
          - id: AC-3
            title: Access Enforcement
            implementation: RBAC enforced via JWT claims on every request, scoped
          - id: AC-6
            title: Least Privilege
            implementation: Role hierarchy — platform_owner > org_owner > org_admin > org_member
          - id: AC-7
            title: Unsuccessful Login Attempts
            implementation: WebAuthn failures logged and rate-limited
          - id: AC-11
            title: Session Lock
            implementation: Idle session timeout, configurable
          - id: AC-12
            title: Session Termination
            implementation: All sessions revocable from dashboard, JWT expiry enforced
          - id: AC-17
            title: Remote Access
            implementation: Passkeys + PQC TLS + audit logging on all remote access
          - id: AU-2
            title: Auditable Events
            implementation: All access events logged — logins, shell, file ops, agent connections, config changes
          - id: AU-3
            title: Content of Audit Records
            implementation: Who, what, when, where (source IP, tenant, agent), outcome
          - id: AU-6
            title: Audit Review
            implementation: Queryable audit logs with filters and search in dashboard
          - id: AU-9
            title: Protection of Audit Information
            implementation: Audit logs are append-only, immutable
          - id: AU-10
            title: Non-repudiation
            implementation: Passkey auth = cryptographic proof of identity; agent tokens = machine identity
          - id: AU-12
            title: Audit Generation
            implementation: Automatic, cannot be disabled
          - id: CM-2
            title: Baseline Configuration
            implementation: Declarative server.yaml, centrally managed agent config
          - id: CM-3
            title: Configuration Change Control
            implementation: All config changes audit-logged
          - id: CM-6
            title: Configuration Settings
            implementation: Hardened defaults — TLS 1.3 only, PQC preferred, no password auth
          - id: CM-7
            title: Least Functionality
            implementation: Agents expose only PTY, file ops, metrics — no unnecessary services
          - id: IA-2
            title: Identification and Authentication
            implementation: WebAuthn passkeys for users, HMAC-SHA256 tokens for agents
          - id: IA-4
            title: Identifier Management
            implementation: UUID v4 for all identifiers (users, agents, tenants, tokens), generated via CSPRNG
          - id: IA-5
            title: Authenticator Management
            implementation: Hardware/platform-bound passkeys, per-agent HMAC tokens
          - id: IA-8
            title: Non-Organizational User Auth
            implementation: All users authenticate via WebAuthn flow
          - id: IA-12
            title: Identity Proofing
            implementation: First user proofed via physical access (setup wizard on localhost only)
          - id: SC-8
            title: Transmission Confidentiality and Integrity
            implementation: TLS 1.3 + PQC hybrid key exchange on all data in transit
          - id: SC-12
            title: Cryptographic Key Establishment
            implementation: CSPRNG (crypto/rand), X25519MLKEM768 hybrid key exchange
          - id: SC-13
            title: Cryptographic Protection
            implementation: All algorithms NIST-approved, FIPS 203/204/205 compliant
          - id: SC-18
            title: Mobile Code
            implementation: All assets embedded (embed.FS), zero CDN. CSP and X-Content-Type-Options headers prevent MIME sniffing
          - id: SC-23
            title: Session Authenticity
            implementation: JWTs signed with Ed25519, sessions bound to authenticated identities
          - id: SC-28
            title: Protection of Information at Rest
            implementation: Sensitive DB fields encrypted with AES-256-GCM, HKDF-SHA256 key derivation
          - id: SI-2
            title: Flaw Remediation
            implementation: Agent auto-update delivers signed binaries from master
          - id: SI-4
            title: System Monitoring
            implementation: Real-time agent metrics, connection status, EventBus live updates
          - id: SI-7
            title: Software Integrity
            implementation: Binary signing with SLH-DSA-SHA2-256s, agents verify before update
          - id: SI-10
            title: Information Input Validation
            implementation: Unknown JSON fields rejected, parameterized SQL only
          - id: SI-12
            title: Information Management and Retention
            implementation: Audit logs append-only, webhook events include minimal PII per data minimization, user deletion events carry only userId
      - id: NIST-SP-800-63B
        name: NIST SP 800-63B
        description: Digital Identity Guidelines — Authentication and Lifecycle Management
        level: AAL2 (AAL3 with hardware authenticator)
        implementation: |
          Passkey-only auth provides AAL2 baseline assurance: cryptographic proof of
          possession, no phishable credentials, verifier impersonation resistance via
          WebAuthn origin check, replay resistance via challenge-response.
          AAL3 is achieved when a hardware cryptographic authenticator (e.g., YubiKey,
          cross-platform) is used. Platform authenticators (Touch ID, Windows Hello)
          meet AAL2. The authenticator attachment type is logged per session.
      - id: NIST-SP-800-131A-R2
        name: NIST SP 800-131A Rev. 2
        description: Transitioning the Use of Cryptographic Algorithms and Key Lengths
        implementation: |
          All internal algorithms meet or exceed requirements. Disallowed algorithms
          (MD5, SHA-1, DES, 3DES, RC4) are unconditionally forbidden. Classical algorithms
          (RSA, standalone ECDSA) accepted only for external-party interactions, logged with warning.
      - id: FIPS-203
        name: FIPS 203 (ML-KEM)
        description: Module-Lattice-Based Key-Encapsulation Mechanism
        implementation: X25519MLKEM768 hybrid key exchange on all TLS connections (Go 1.24 stdlib)
      - id: FIPS-204
        name: FIPS 204 (ML-DSA)
        description: Module-Lattice-Based Digital Signature Algorithm
        implementation: ML-DSA-65 will replace Ed25519 for JWT signing when Go stdlib ships it
      - id: FIPS-205
        name: FIPS 205 (SLH-DSA)
        description: Stateless Hash-Based Digital Signature Algorithm
        implementation: SLH-DSA-SHA2-256s for binary signing (agent updates, release artifacts)
      - id: NIST-SP-800-57
        name: NIST SP 800-57
        description: Recommendation for Key Management
        implementation: |
          CSPRNG (crypto/rand) only, purpose-bound keys, automated TLS rotation (ACME),
          configurable JWT rotation, per-agent HMAC keys.

servers:
  - url: https://{domain}/api/v1
    description: Conduit CE server (self-hosted)
    variables:
      domain:
        default: localhost
        description: The domain name configured during setup wizard
  - url: http://localhost:8080
    description: Setup wizard (first-run only, localhost, no TLS)
  - url: https://localhost:8443/api/v1
    description: Dev mode (self-signed TLS, --dev flag or server.mode dev)

tags:
  # ── Platform tags (no service scope — shared across all services) ──
  - name: Setup Wizard
    description: |
      First-run server configuration. Localhost-only on HTTP port 8080.
      After completion, setup endpoints return 404 forever.
      NIST IA-12: Identity proofing via physical access to server.
  - name: Auth
    description: |
      WebAuthn passkey authentication, JWT token management, CLI device flow,
      CI token management. NIST IA-2, IA-5, SP 800-63B AAL2/AAL3.
  - name: Sessions
    description: |
      Session visibility and revocation across all auth methods (web, CLI, CI).
      NIST AC-11, AC-12.
  - name: Users
    description: |
      User account lifecycle management. NIST AC-2.
  - name: Groups
    description: |
      Group management for organizing users and applying RBAC policies.
  - name: RBAC
    description: |
      Role-based access control. Roles: platform_owner, org_owner, org_admin, org_member.
      NIST AC-3, AC-6.
  - name: Services
    description: |
      Service registry. Lists services enabled for the tenant.
      CE ships with one service (`remote-access`). The SaaS platform adds more.
      Middleware checks `jwt.services` includes the required `x-service` for each endpoint.
  - name: Audit
    description: |
      Immutable, scoped audit logs for all access events.
      NIST AU-2, AU-3, AU-6, AU-9, AU-10, AU-12.
  - name: Webhooks
    description: |
      Webhook subscription management and event delivery configuration.
      HMAC-SHA256 signed payloads. At-least-once delivery.
  - name: EventBus
    description: |
      Real-time WebSocket event stream for dashboard updates.
      No polling. All state changes pushed immediately.
  - name: Server Config
    description: |
      Server configuration management. NIST CM-2, CM-3, CM-6.
  - name: ACME
    description: |
      ACME TLS certificate auto-provisioning via Let's Encrypt.
  - name: Health
    description: |
      Server health and status endpoints. Public, no auth required.

  # ── Service: remote-access ──────────────────────────────────────
  # All tags below belong to the `remote-access` service.
  # Middleware enforces: jwt.services must include "remote-access".
  # To add a new service, define new tags with a different x-service value.
  - name: Agents
    description: |
      Agent registration, connection management, metrics, labels, auto-update.
      NIST CM-7, SI-2, SI-4, SI-7.
    x-service: remote-access
  - name: Shell
    description: |
      Terminal shell sessions in browser and CLI. PTY execution on agents.
      Multiple concurrent sessions via CWP multiplexing. Session recording.
    x-service: remote-access
  - name: Files
    description: |
      Remote file management — list, upload, download, delete, rename, mkdir, preview.
      File transfer over HTTPS/QUIC, resumable uploads.
    x-service: remote-access
  - name: Bulk Operations
    description: |
      Multi-server parallel command execution and binary deployment.
    x-service: remote-access
  - name: Metrics
    description: |
      Agent system metrics — CPU, RAM, disk, network. Time-series data via
      VictoriaMetrics or SQLite ring-buffer.
    x-service: remote-access
  - name: Labels
    description: |
      Universal resource labelling system for surgical targeting of agents and resources.
    x-service: remote-access
  - name: Binary Signing
    description: |
      SLH-DSA-SHA2-256s binary signing for agent updates and release artifacts.
      NIST FIPS 205, SI-7.
    x-service: remote-access

security:
  - BearerAuth: []

paths:
  # ════════════════════════════════════════════════════════════════
  # HEALTH & STATUS
  # ════════════════════════════════════════════════════════════════

  /health:
    get:
      operationId: getHealth
      summary: Health check
      description: |
        Returns server health status. No authentication required.
        Used by load balancers, monitoring, and agent connectivity checks.
      tags: [Health]
      security: []
      x-nist-controls: [SI-4]
      x-owasp: [A05, API8]
      x-rate-limit: { window: 1m, limit: 60 }
      responses:
        "200":
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                required: [status, version, uptime, mode, transport]
                properties:
                  status:
                    type: string
                    enum: [healthy, degraded]
                  version:
                    type: string
                    example: "1.0.0"
                  uptime:
                    type: string
                    description: Human-readable uptime
                    example: "3d 14h 22m"
                  uptimeSeconds:
                    type: integer
                    format: int64
                    example: 310920
                  mode:
                    type: string
                    enum: [standalone]
                    description: Server operating mode
                  transport:
                    type: object
                    required: [quic, websocket, http3, http2]
                    properties:
                      quic:
                        type: boolean
                        description: QUIC listener active (UDP 443)
                      websocket:
                        type: boolean
                        description: WebSocket listener active (TCP 443)
                      http3:
                        type: boolean
                        description: HTTP/3 serving active
                      http2:
                        type: boolean
                        description: HTTP/2 fallback active
                  tls:
                    type: object
                    properties:
                      version:
                        type: string
                        const: "1.3"
                        description: Only TLS 1.3 is permitted
                      keyExchange:
                        type: string
                        example: "X25519MLKEM768"
                        description: PQC hybrid key exchange (FIPS 203)
                      cipherSuites:
                        type: array
                        items:
                          type: string
                        example:
                          - TLS_AES_256_GCM_SHA384
                          - TLS_AES_128_GCM_SHA256
                          - TLS_CHACHA20_POLY1305_SHA256

  # ════════════════════════════════════════════════════════════════
  # SETUP WIZARD (First Run — localhost:8080 only)
  # ════════════════════════════════════════════════════════════════

  /setup/status:
    get:
      operationId: getSetupStatus
      summary: Check if setup wizard is available
      description: |
        Returns whether the server is in first-run setup mode.
        After setup completes, this endpoint returns 404 **forever**.
        Setup mode flag is stored in the database, not config file — cannot
        be re-triggered by deleting config.

        **NIST IA-12:** Identity proofing via physical localhost access.
      tags: [Setup Wizard]
      security: []
      x-nist-controls: [IA-12]
      x-owasp: [A05, API8]
      x-rate-limit: { window: 1m, limit: 30 }
      responses:
        "200":
          description: Setup wizard is available (first run)
          content:
            application/json:
              schema:
                type: object
                required: [setupRequired, currentStep]
                properties:
                  setupRequired:
                    type: boolean
                    const: true
                  currentStep:
                    type: string
                    enum:
                      - domain_config
                      - admin_account
                      - acme_provisioning
                      - passkey_registration
                      - complete
                  completedSteps:
                    type: array
                    items:
                      type: string
        "404":
          description: Setup already completed — endpoint permanently disabled

  /setup/configure:
    post:
      operationId: configureSetup
      summary: Submit setup wizard configuration
      description: |
        Submits the initial server configuration during first-run setup.
        Localhost-only, HTTP only (no TLS yet).

        **Flow:**
        1. Validates `setupToken` against the server-generated token (NIST IA-12 — proves console access)
        2. Collects domain name, admin email, org name, first user details
        3. Server writes `server.yaml`
        4. Server obtains ACME TLS certificate from Let's Encrypt
        5. Creates default tenant (UUID generated, NIST IA-4) and first user with `platform_owner` role
        6. Seeds `remote-access` service and links it to the tenant (`tenant_services`)
        7. Restarts on HTTPS port 443

        The setup token is generated by the server on first start (CSPRNG, 32 bytes, base64url)
        and printed to the server process stdout. It is never transmitted over the network
        by the server — the operator must copy it from the console.

        **NIST IA-12, CM-2, IA-5:** Identity proofing via console access, baseline configuration, authenticator management.
      tags: [Setup Wizard]
      security: []
      x-nist-controls: [IA-4, IA-12, CM-2, IA-5]
      x-owasp: [A01, A03, A05, API5, API8]
      x-audit-event: setup.configured
      x-rate-limit: { window: 1m, limit: 5 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [setupToken, domain, adminEmail, organizationName, firstName, lastName]
              properties:
                setupToken:
                  type: string
                  minLength: 43
                  maxLength: 43
                  writeOnly: true
                  description: |
                    Server-generated setup token (CSPRNG, 32 bytes, base64url-encoded = 43 chars).
                    Printed to server stdout on first start. Proves operator has console access
                    to the server process (NIST IA-12 identity proofing).
                    Validated with constant-time comparison.
                  example: "dGhpcyBpcyBhIHNhbXBsZSBzZXR1cCB0b2tlbg"
                domain:
                  type: string
                  format: hostname
                  maxLength: 253
                  description: Public domain name for the Conduit server
                  example: "conduit.example.com"
                adminEmail:
                  type: string
                  format: email
                  maxLength: 254
                  description: Email for the platform owner account
                  example: "admin@example.com"
                organizationName:
                  type: string
                  minLength: 1
                  maxLength: 255
                  description: Organization name for the default tenant
                  example: "Acme Corp"
                firstName:
                  type: string
                  minLength: 1
                  maxLength: 100
                lastName:
                  type: string
                  minLength: 1
                  maxLength: 100
                serverMode:
                  type: string
                  enum: [standalone]
                  default: standalone
                  description: |
                    `standalone` — single-tenant, self-hosted mode. A tenant UUID is generated
                    at setup time (NIST IA-4, REC-API-24 — no predictable identifiers).
                    SaaS mode is available in the full Conduit platform.
              additionalProperties: false
            examples:
              selfHosted:
                summary: Self-hosted single-tenant setup
                value:
                  setupToken: "dGhpcyBpcyBhIHNhbXBsZSBzZXR1cCB0b2tlbg"
                  domain: "conduit.example.com"
                  adminEmail: "admin@example.com"
                  organizationName: "Acme Corp"
                  firstName: "Jane"
                  lastName: "Admin"
                  serverMode: "standalone"
      responses:
        "202":
          description: Configuration accepted, provisioning in progress
          content:
            application/json:
              schema:
                type: object
                required: [status, message, redirectUrl]
                properties:
                  status:
                    type: string
                    enum: [provisioning]
                  message:
                    type: string
                    example: "ACME certificate provisioning in progress. Server will restart on HTTPS."
                  redirectUrl:
                    type: string
                    format: uri
                    description: URL to redirect browser to after HTTPS restart
                    example: "https://conduit.example.com/setup/passkey"
                  estimatedSeconds:
                    type: integer
                    example: 30
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Setup already completed
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /setup/passkey:
    post:
      operationId: setupPasskeyRegistration
      summary: Register the first passkey during setup
      description: |
        Forces passkey registration for the platform owner during setup.
        Requires the same setup token used in `/setup/configure` (proves continued console access).
        No other action is possible until a passkey is registered.

        After successful registration in production:
        - Setup token is DELETE'd from the database (not set to NULL)
        - Setup mode is permanently deactivated
        - `GET /setup/*` returns 404 forever

        In dev mode, the setup token is NOT deleted after passkey registration
        — both passkey and password auth remain available for convenience
        (WebAuthn requires a secure context that self-signed dev certs may not satisfy).

        **NIST IA-2, IA-12, SP 800-63B AAL2/AAL3:** Identity proofing and establishing phishing-resistant credential.
      tags: [Setup Wizard]
      security: []
      x-nist-controls: [IA-2, IA-12]
      x-owasp: [A01, A02, A07, API2, API5]
      x-audit-event: setup.passkey.registered
      x-rate-limit: { window: 1m, limit: 5 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [setupToken, credential]
              properties:
                setupToken:
                  type: string
                  minLength: 43
                  maxLength: 43
                  writeOnly: true
                  description: |
                    Same server-generated setup token used in `/setup/configure`.
                    Proves continued console access (NIST IA-12).
                    Validated with constant-time comparison.
                credential:
                  $ref: "#/components/schemas/WebAuthnRegistrationResponse"
              additionalProperties: false
      responses:
        "201":
          description: Passkey registered, setup complete
          content:
            application/json:
              schema:
                type: object
                required: [status, message, accessToken, refreshToken]
                properties:
                  status:
                    type: string
                    const: "setup_complete"
                  message:
                    type: string
                    example: "Passkey registered. Setup complete."
                  accessToken:
                    type: string
                    description: JWT access token (Ed25519 signed)
                  refreshToken:
                    type: string
                    description: Refresh token for token renewal
                  user:
                    $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Setup already completed
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ════════════════════════════════════════════════════════════════
  # AUTH — WebAuthn / Passkeys
  # ════════════════════════════════════════════════════════════════

  /auth/webauthn/register/begin:
    post:
      operationId: beginWebAuthnRegistration
      summary: Begin passkey registration ceremony
      description: |
        Initiates WebAuthn registration (credential creation).
        Returns a PublicKeyCredentialCreationOptions challenge.

        The server is a WebAuthn Relying Party. Users register passkeys
        (platform authenticators like Touch ID / Windows Hello, or roaming
        authenticators like YubiKeys).

        **NIST IA-2, IA-5, SP 800-63B AAL2/AAL3.**
      tags: [Auth]
      x-nist-controls: [IA-2, IA-5]
      x-owasp: [A07, API2]
      x-audit-event: passkey.registration.started
      responses:
        "200":
          description: Registration challenge issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthnCreationOptions"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /auth/webauthn/register/finish:
    post:
      operationId: finishWebAuthnRegistration
      summary: Complete passkey registration ceremony
      description: |
        Completes WebAuthn registration by verifying the authenticator's attestation.
        Stores the credential public key. The server never sees or stores a password.

        Accepted authenticator algorithms (external party chooses):
        - ECDSA P-256 (hardware authenticators)
        - Ed25519
        - RSA (legacy authenticators)

        Classical algorithms are accepted but logged with warning per NIST SP 800-131A.

        **NIST IA-5(2), AU-12.**
        **x-audit-event:** passkey.registered
      tags: [Auth]
      x-nist-controls: [IA-5, AU-12]
      x-owasp: [A07, A02, API2]
      x-audit-event: passkey.registered
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthnRegistrationResponse"
      responses:
        "201":
          description: Passkey registered successfully
          content:
            application/json:
              schema:
                type: object
                required: [credentialId, algorithm, createdAt]
                properties:
                  credentialId:
                    type: string
                    format: base64url
                  algorithm:
                    type: string
                    description: Algorithm chosen by the authenticator
                    example: "ECDSA-P256"
                  algorithmWarning:
                    type:
                      - string
                      - "null"
                    description: |
                      Non-null if a classical (quantum-vulnerable) algorithm was used.
                      Logged per NIST SP 800-131A.
                    example: "Classical algorithm — quantum-vulnerable. PQC not available on this authenticator."
                  createdAt:
                    type: string
                    format: date-time
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /auth/webauthn/login/begin:
    post:
      operationId: beginWebAuthnLogin
      summary: Begin passkey login ceremony
      description: |
        Initiates WebAuthn authentication (credential assertion).
        Returns a PublicKeyCredentialRequestOptions challenge with server-generated nonce.

        **Replay resistance:** Built into WebAuthn protocol (challenge-response).
        **Verifier impersonation resistance:** Browser verifies the origin.

        **NIST IA-2, AC-7, SP 800-63B AAL2/AAL3.**
      tags: [Auth]
      security: []
      x-nist-controls: [IA-2, AC-7]
      x-owasp: [A07, API2]
      x-rate-limit: { window: 1m, limit: 10 }
      x-audit-event: auth.login.webauthn.started
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                  description: Optional — for discoverable credential hints
              additionalProperties: false
      responses:
        "200":
          description: Login challenge issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthnRequestOptions"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/webauthn/login/finish:
    post:
      operationId: finishWebAuthnLogin
      summary: Complete passkey login ceremony
      description: |
        Completes WebAuthn authentication by verifying the assertion signature.
        Issues a JWT access token (Ed25519 signed) and refresh token.

        **JWT Claims:**
        - `sub` — User ID (UUID v4)
        - `tid` — Tenant ID
        - `services` — Array of enabled service slugs (e.g. `["remote-access"]`)
        - `roles` — Array of role identifiers
        - `permissions` — Array of permission strings
        - `iat` — Issued at
        - `exp` — Expiration (configurable, default 15 minutes)

        **NIST AC-7, AC-12, SC-23:** Rate-limited, session bound to authenticated identity.
        **x-audit-event:** auth.login.webauthn
      tags: [Auth]
      security: []
      x-nist-controls: [IA-2, AC-7, AC-12, SC-23, AU-12]
      x-owasp: [A07, A02, API2]
      x-rate-limit: { window: 1m, limit: 10 }
      x-audit-event: auth.login.webauthn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthnAssertionResponse"
      responses:
        "200":
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: |
            Authentication failed. Returns identical error regardless of
            failure reason — no user enumeration (NIST AC-7, OWASP A07).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/webauthn/credentials:
    get:
      operationId: listPasskeys
      summary: List registered passkeys
      description: |
        Lists all passkeys registered by the authenticated user.
        Each entry shows credential ID, authenticator type, algorithm,
        creation date, and last used date.
      tags: [Auth]
      x-nist-controls: [IA-5]
      x-owasp: [A01, API1, API3]
      responses:
        "200":
          description: List of registered passkeys
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PasskeyCredential"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /auth/webauthn/credentials/{credentialId}:
    delete:
      operationId: deletePasskey
      summary: Delete a registered passkey
      description: |
        Removes a passkey. Cannot delete the last remaining passkey
        (user must always have at least one).

        **NIST IA-5:** Authenticator management.
        **x-audit-event:** passkey.deleted
      tags: [Auth]
      x-nist-controls: [IA-5, AU-12]
      x-owasp: [A01, API1, API5]
      x-audit-event: passkey.deleted
      parameters:
        - name: credentialId
          in: path
          required: true
          schema:
            type: string
            format: base64url
            maxLength: 1024
      responses:
        "204":
          description: Passkey deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  # ════════════════════════════════════════════════════════════════
  # AUTH — Setup Token / Password (Dev Mode Only)
  # ════════════════════════════════════════════════════════════════

  /auth/password/login:
    post:
      operationId: passwordLogin
      summary: Password login (dev mode only)
      description: |
        Password authentication is available ONLY in dev mode (`server.mode: dev`).
        In production, this endpoint returns 404.

        In dev mode, the setup token doubles as the login password — the server
        hashes it with Argon2id (m=64MB, t=3, p=4) and stores it as the admin's
        password hash. The setup token is NOT deleted after setup in dev mode
        because WebAuthn requires a secure context (HTTPS with valid cert or
        localhost origin) which self-signed dev certs may not satisfy.

        If a passkey is successfully registered in dev mode, both passkey and
        password auth remain available for convenience.

        Production setup uses the setup token flow (`/setup/configure` + `/setup/passkey`)
        with no password ever created. The setup token is permanently deleted after
        passkey registration.

        **NIST AC-7:** Failed attempts are logged and rate-limited.
        **x-audit-event:** auth.login.password
      tags: [Auth]
      security: []
      x-nist-controls: [AC-7, AU-12]
      x-owasp: [A07, A02, A03, API2]
      x-rate-limit: { window: 1m, limit: 5 }
      x-audit-event: auth.login.password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                password:
                  type: string
                  format: password
                  maxLength: 128
                  writeOnly: true
              additionalProperties: false
      responses:
        "200":
          description: Login successful (returns JWT + forced passkey registration redirect)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/AuthTokenResponse"
                  - type: object
                    properties:
                      forcePasskeyRegistration:
                        type: boolean
                        description: If true, client MUST redirect to passkey registration
        "401":
          description: |
            Invalid credentials. Returns identical error for invalid email
            or wrong password — no user enumeration (NIST AC-7, OWASP A07).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Password auth disabled (production mode)
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ════════════════════════════════════════════════════════════════
  # AUTH — JWT Token Management
  # ════════════════════════════════════════════════════════════════

  /auth/token/refresh:
    post:
      operationId: refreshToken
      summary: Refresh JWT access token
      description: |
        Exchanges a valid refresh token for a new access token.
        Access tokens are short-lived (default 15 minutes).
        Refresh tokens have configurable expiry (default 24 hours) with rotation.

        **NIST SC-23:** Session authenticity maintained via signed token chain.
      tags: [Auth]
      security: []
      x-nist-controls: [SC-23, AC-12]
      x-owasp: [A07, A02, API2]
      x-rate-limit: { window: 1m, limit: 30 }
      x-audit-event: auth.token.refreshed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
                  maxLength: 4096
                  writeOnly: true
              additionalProperties: false
      responses:
        "200":
          description: New tokens issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
        "401":
          description: Invalid or expired refresh token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/token/revoke:
    post:
      operationId: revokeToken
      summary: Revoke a token
      description: |
        Revokes a specific access or refresh token. Immediate effect.

        **NIST AC-12:** Session termination.
        **x-audit-event:** auth.token.revoked
      tags: [Auth]
      x-nist-controls: [AC-12, AU-12]
      x-owasp: [A07, API2]
      x-audit-event: auth.token.revoked
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  maxLength: 4096
                  writeOnly: true
                tokenType:
                  type: string
                  enum: [access, refresh]
                  default: access
              additionalProperties: false
      responses:
        "204":
          description: Token revoked
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ════════════════════════════════════════════════════════════════
  # AUTH — CLI Device Flow
  # ════════════════════════════════════════════════════════════════

  /auth/device/begin:
    post:
      operationId: beginDeviceFlow
      summary: Begin CLI device authorization flow
      description: |
        Initiates the browser-based device flow for CLI authentication.
        The CLI opens the user's browser to the Conduit instance, the user
        authenticates with their passkey, and a scoped CLI token is returned.

        Returns a device code and a browser URL. The CLI displays the URL
        and polls `/auth/device/poll` until the user completes authentication.

        **NIST IA-2:** Multi-factor via passkey in browser.
      tags: [Auth]
      security: []
      x-nist-controls: [IA-2]
      x-owasp: [A07, API2, API4]
      x-rate-limit: { window: 1m, limit: 10 }
      x-audit-event: auth.device.flow_started
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientId]
              properties:
                clientId:
                  type: string
                  maxLength: 255
                  description: CLI client identifier
                profileName:
                  type: string
                  maxLength: 255
                  description: CLI profile name for credential storage
                  example: "production"
              additionalProperties: false
      responses:
        "200":
          description: Device flow initiated
          content:
            application/json:
              schema:
                type: object
                required: [deviceCode, userCode, verificationUri, expiresIn, interval]
                properties:
                  deviceCode:
                    type: string
                    description: Device code for polling
                  userCode:
                    type: string
                    description: User-facing code to display
                    example: "ABCD-1234"
                  verificationUri:
                    type: string
                    format: uri
                    description: URL to open in browser
                  expiresIn:
                    type: integer
                    description: Seconds until device code expires
                    example: 900
                  interval:
                    type: integer
                    description: Minimum seconds between poll requests
                    example: 5
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/device/poll:
    post:
      operationId: pollDeviceFlow
      summary: Poll CLI device authorization status
      description: |
        The CLI polls this endpoint with the device code until the user
        completes authentication in the browser.

        The CLI stores the returned token encrypted on disk, per-profile.
      tags: [Auth]
      security: []
      x-nist-controls: [IA-2]
      x-owasp: [A07, API2, API4]
      x-rate-limit: { window: 1m, limit: 20 }
      x-audit-event: auth.device.token_issued
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceCode]
              properties:
                deviceCode:
                  type: string
                  maxLength: 255
                  writeOnly: true
              additionalProperties: false
      responses:
        "200":
          description: Authorization complete — token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
        "400":
          description: |
            Pending, slow down, or expired. Check `error` field:
            - `authorization_pending` — user hasn't completed auth yet
            - `slow_down` — polling too fast
            - `expired_token` — device code expired
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    enum: [authorization_pending, slow_down, expired_token]
                  retryAfter:
                    type: integer
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/device/authorize:
    post:
      operationId: authorizeDevice
      summary: User authorizes CLI device in browser
      description: |
        Called by the browser after the user authenticates with their passkey.
        Links the device code to the authenticated session.
      tags: [Auth]
      x-nist-controls: [IA-2, AU-12]
      x-owasp: [A01, A07, API2, API5]
      x-rate-limit: { window: 1m, limit: 10 }
      x-audit-event: auth.device.authorized
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userCode]
              properties:
                userCode:
                  type: string
                  maxLength: 20
                  description: The code displayed by the CLI
              additionalProperties: false
      responses:
        "200":
          description: Device authorized
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Invalid or expired user code
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ════════════════════════════════════════════════════════════════
  # AUTH — CI / Machine Tokens
  # ════════════════════════════════════════════════════════════════

  /auth/ci-tokens:
    get:
      operationId: listCiTokens
      summary: List CI/automation tokens
      description: |
        Lists all CI tokens for the authenticated user.
        Tokens are scoped and revocable. Used via `CONDUIT_TOKEN` env var.

        **NIST IA-5:** Machine-to-machine authenticator management.
      tags: [Auth]
      x-nist-controls: [IA-5]
      x-owasp: [A01, API1, API3, API5]
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: Paginated list of CI tokens
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/CiToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createCiToken
      summary: Create a CI/automation token
      description: |
        Creates a new scoped, revocable CI token.
        The token value is returned once and cannot be retrieved again.

        **NIST SC-28:** Token value shown once only.
        **x-audit-event:** ci_token.created
      tags: [Auth]
      x-nist-controls: [IA-5, SC-28, AU-12]
      x-owasp: [A01, A02, API2, API5]
      x-rate-limit: { window: 1m, limit: 10 }
      x-audit-event: ci_token.created
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                  description: Human-readable name
                  example: "GitHub Actions deploy"
                scopes:
                  type: array
                  items:
                    type: string
                    enum:
                      - agents:read
                      - agents:write
                      - shell:execute
                      - files:read
                      - files:write
                      - exec:run
                      - audit:read
                      - users:read
                      - users:write
                      - config:read
                      - config:write
                  minItems: 1
                  maxItems: 20
                  description: Permissions granted to this token
                expiresAt:
                  type:
                    - string
                    - "null"
                  format: date-time
                  maxLength: 35
                  description: Expiration timestamp. Null for non-expiring (not recommended).
              additionalProperties: false
      responses:
        "201":
          description: Token created — value shown once
          content:
            application/json:
              schema:
                type: object
                required: [id, name, token, scopes, createdAt]
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  token:
                    type: string
                    description: |
                      The token value. **Shown only once.** Cannot be retrieved again.
                      Store securely. Use as `CONDUIT_TOKEN` env var or `Authorization: Bearer <token>`.
                  scopes:
                    type: array
                    items:
                      type: string
                  expiresAt:
                    type:
                      - string
                      - "null"
                    format: date-time
                  createdAt:
                    type: string
                    format: date-time
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/ci-tokens/{tokenId}:
    delete:
      operationId: revokeCiToken
      summary: Revoke a CI token
      description: |
        Permanently revokes a CI token. Immediate effect.

        **x-audit-event:** ci_token.revoked
      tags: [Auth]
      x-nist-controls: [IA-5, AU-12]
      x-owasp: [A01, API1, API5]
      x-audit-event: ci_token.revoked
      parameters:
        - name: tokenId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Token revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ════════════════════════════════════════════════════════════════
  # AUTH — SSO (SAML/OIDC)
