  /webhooks/subscriptions:
    get:
      operationId: listWebhookSubscriptions
      summary: List webhook subscriptions
      tags: [Webhooks]
      x-nist-controls: [AU-12]
      x-owasp: [A01, API1, API3]
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: List of webhook subscriptions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/WebhookSubscription"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createWebhookSubscription
      summary: Create webhook subscription
      description: |
        Registers an endpoint to receive audit event webhooks.
        Payloads are signed with HMAC-SHA256.
        At-least-once delivery with exponential backoff retries (max 10 attempts,
        backoff: min(2^attempt, 3600) seconds with jitter).

        **URL validation:** Production requires HTTPS with valid TLS cert.
        Dev mode permits `http://localhost` / `http://127.0.0.1` (loopback)
        and HTTPS with self-signed certs. See `url` field for details.

        **x-audit-event:** webhook.subscription.created
      tags: [Webhooks]
      x-nist-controls: [AU-12]
      x-owasp: [A01, A10, API1, API5, API7]
      x-audit-event: webhook.subscription.created
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookSubscriptionCreate"
      responses:
        "201":
          description: Subscription created — signing secret shown once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookSubscription"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

