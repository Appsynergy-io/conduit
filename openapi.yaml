            schema:
              $ref: "#/components/schemas/SsoProviderCreate"
      responses:
        "200":
          description: Provider updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SsoProvider"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteSsoProvider
      summary: Delete SSO provider
      tags: [Auth]
      x-nist-controls: [IA-2, AU-12]
      x-owasp: [A01, API1, API5]
      x-audit-event: sso_provider.deleted
      parameters:
        - $ref: "#/components/parameters/PathProviderId"
      responses:
        "204":
          description: Provider deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /auth/sso/{providerId}/saml/callback:
    post:
      operationId: samlCallback
      summary: SAML assertion consumer service
      tags: [Auth]
      security: []
      x-nist-controls: [IA-2]
      x-owasp: [A07, A02, API2, API10]
      x-rate-limit: { window: 1m, limit: 10 }
      x-audit-event: auth.login.saml
      parameters:
        - $ref: "#/components/parameters/PathProviderId"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [SAMLResponse]
              properties:
                SAMLResponse:
                  type: string
                  maxLength: 1048576
                RelayState:
                  type: string
                  maxLength: 4096
              additionalProperties: false
      responses:
        "302":
          description: Redirect to dashboard with session token
        "401":
          description: SAML assertion validation failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/sso/{providerId}/oidc/callback:
    get:
      operationId: oidcCallback
      summary: OIDC authorization code callback
      description: |
        Standard OAuth2/OIDC authorization code callback. Uses GET with query
        parameters per RFC 6749 §4.1.2. The authorization code in the query string
        is a documented exception to the "no sensitive data in URLs" rule — this is
        required by the OIDC specification and the code is single-use with short expiry.
      tags: [Auth]
      security: []
      x-nist-controls: [IA-2]
      x-owasp: [A07, A02, API2, API10]
      x-rate-limit: { window: 1m, limit: 10 }
      x-audit-event: auth.login.oidc
      parameters:
        - $ref: "#/components/parameters/PathProviderId"
        - name: code
          in: query
          required: true
          schema:
            type: string
            maxLength: 2048
        - name: state
          in: query
          required: true
          schema:
            type: string
            maxLength: 2048
      responses:
        "302":
          description: Redirect to dashboard with session token
        "401":
          description: OIDC token validation failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "429":
          $ref: "#/components/responses/TooManyRequests"

