run:
  timeout: 5m
  go: "1.26"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - gofumpt
    - gosec
    - bodyclose
    - sqlclosecheck
    - exhaustive
    - noctx
    - unparam
    - wastedassign
    - errorlint
    - tenv

linters-settings:
  gofumpt:
    extra-rules: true
  gosec:
    excludes: []
  exhaustive:
    default-signifies-exhaustive: true
  errorlint:
    errorf: true
    asserts: true
    comparison: true

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - errcheck
  max-issues-per-linter: 0
  max-same-issues: 0
